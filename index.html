  /* ---------- 主题归类 ---------- */
  function signalsOf(text, tags) {
    var toks = tokenize(text);
    var setWord = {}, setCluster = {};
    toks.forEach(function (t) {
      setWord[t.w] = (setWord[t.w] || 0) + 1;
      var ci = CLUSTER_OF[t.w];
      if (ci != null) setCluster[ci] = (setCluster[ci] || 0) + 1;
    });
    return { toks: toks, word: setWord, cluster: setCluster, hay: String(text || '') + ' ' + (tags || []).join(' ') };
  }

  function scoreTopic(t, sig, ctx) {
    var score = 0, hits = [];

    // 1) 主题关键词直接出现（最强信号）
    (t.keywords || []).forEach(function (kw) {
      if (!kw) return;
      if (sig.hay.indexOf(kw) >= 0) {
        score += 0.6 * (1 + 0.3 * (kw.length - 1));
        hits.push(kw);
      } else if (sig.word[kw]) {
        score += 0.45;
        hits.push(kw);
      }
    });

    // 2) 主题词库与正文的语义族重合
    if (ctx.topicClusters[t.id]) {
      Object.keys(ctx.topicClusters[t.id]).forEach(function (ci) {
        if (sig.cluster[ci]) {
          score += 0.3 * Math.min(2, sig.cluster[ci]);
          hits.push(CLUSTER_TERMS[ci][0]);
        }
      });
    }

    // 3) 主题名下已有内容的用词倾向
    var same = ctx.byTopic[t.id] || [];
    if (same.length) {
      var agree = 0, matched = 0;
      same.slice(0, 40).forEach(function (it) {
        var v = vecOf(it);
        var s = cosSparse(vecOf({ text: sig.hay, tags: [], topicIds: [] }).keys, v.keys);
        if (s > 0.1) { agree += s; matched++; }
      });
      if (agree > 0) score += Math.min(0.55, agree * 0.5);
      if (matched) score += 0.05;
      score += Math.min(0.1, same.length * 0.008);
    }

    return { score: score, hits: uniq(hits).slice(0, 5) };
  }

  function buildCtx() {
    var d = DB.load();
    var ctx = { byTopic: {}, topicClusters: {} };
    d.topics.forEach(function (t) {
      ctx.topicClusters[t.id] = {};
      (t.keywords || []).forEach(function (kw) {
        var ci = CLUSTER_OF[kw];
        if (ci != null) ctx.topicClusters[t.id][ci] = 1;
      });
      tokenize((t.name || '') + ' ' + (t.desc || '')).forEach(function (tk) {
        var ci = CLUSTER_OF[tk.w];
        if (ci != null) ctx.topicClusters[t.id][ci] = 1;
      });
      ctx.byTopic[t.id] = d.frags.filter(function (f) { return (f.topicIds || []).indexOf(t.id) >= 0; })
        .concat(d.cards.filter(function (c) { return (c.topicIds || []).indexOf(t.id) >= 0; }));
    });
    return ctx;
  }

  function rankTopics(text, tags) {
    var topics = DB.load().topics;
    var sig = signalsOf(text, tags);
    var ctx = buildCtx();
    var out = topics.map(function (t) {
      var r = scoreTopic(t, sig, ctx);
      return { topicId: t.id, name: t.name, score: r.score, hits: r.hits, hue: t.hue };
    });
    out.sort(function (a, b) { return b.score - a.score; });
    return out;
  }

  function classify(text, tags) {
    var ranked = rankTopics(text, tags);
    if (!ranked.length) return { topicId: '', score: 0, reason: '还没有主题', suggestions: [] };
    var top = ranked[0];
    var second = ranked[1];
    // 归一化成可读置信度（分数天然可超过 1）
    var conf = Math.min(0.97, top.score / (top.score + 0.85));
    if (top.score < 0.45) {
      return {
        topicId: '', score: conf,
        suggestions: top.score > 0.2 ? [{ topicId: top.topicId, name: top.name, score: conf }] : [],
        reason: '信号不足，先留在收件箱'
      };
    }
    // 与第二名过于接近时降级为「建议」
    if (second && second.score > 0 && top.score / second.score < 1.18) {
      return {
        topicId: '', score: conf,
        suggestions: [top, second].filter(function (r) { return r.score > 0.25; })
          .map(function (r) { return { topicId: r.topicId, name: r.name, score: Math.min(0.97, r.score / (r.score + 0.85)) }; }),
        reason: '两个主题都很接近，请手动选择'
      };
    }
    top.conf = conf;
    return top;
  }

  function topicKeywordSuggestions(topicId, n) {
    var frags = DB.load().frags.filter(function (f) { return (f.topicIds || []).indexOf(topicId) >= 0; });
    var freq = {};
    frags.forEach(function (f) {
      tokenize(f.text).forEach(function (t) {
        if (t.w.length < 2) return;
        freq[t.w] = (freq[t.w] || 0) + 1;
      });
    });
    var topic = DB.get('topic', topicId);
    var exist = {};
    if (topic) (topic.keywords || []).forEach(function (k) { exist[k] = 1; });
    return Object.keys(freq)
      .filter(function (k) { return !exist[k] && freq[k] >= 2; })
      .sort(function (a, b) { return freq[b] - freq[a] || b.length - a.length; })
      .slice(0, n || 6);
  }

  function suggestForLoose(limit) {
    var loose = DB.load().frags.filter(function (f) { return !(f.topicIds || []).length; });
    var out = [];
    loose.forEach(function (f) {
      var r = classify(f.text, f.tags);
      if (r.topicId) out.push({ frag: f, rec: r });
      else if (r.suggestions && r.suggestions.length) {
        out.push({ frag: f, rec: { topicId: r.suggestions[0].topicId, name: r.suggestions[0].name, score: r.suggestions[0].score * 0.8 } });
      }
    });
    out.sort(function (a, b) { return b.rec.score - a.rec.score; });
    return out.slice(0, limit || 6);
  }

  function uniq(arr) {
    var seen = {}, out = [];
    arr.forEach(function (x) { if (x && !seen[x]) { seen[x] = 1; out.push(x); } });
    return out;
  }

  global.Engine = {
    tokenize: tokenize, keywords: keywords,
    similarity: similarity, readable: readable,
    findSimilar: findSimilar, similarityClusters: similarityClusters,
    classify: classify, rankTopics: rankTopics,
    topicKeywordSuggestions: topicKeywordSuggestions, suggestForLoose: suggestForLoose,
    uniq: uniq, STOP: STOP, LEX: LEX, CLUSTER_OF: CLUSTER_OF
  };
})(window);

</script>
<script>
/* ===========================================================
   灵感笔记 · 同步层
   把本地每条记录拆成「明文元数据 + 密文内容」，与远端按版本戳
   做 LWW 合并。服务端自始至终只见密文。
   =========================================================== */
(function (global) {
  'use strict';

  var CFGKEY = 'spark-notes/sync';
  var AUTHKEY = 'spark-notes/sync/auth';
  var TABLE = 'spark_notes';
  var BATCH = 200;

  /* 明文元数据白名单 —— 合并算法只依赖这几个字段，所以它们留在壳上；
     其余内容一律进密文。代价是服务端能看到「有这么一条记录、什么时候改的」，
     换来的是它拿着密文也能正确裁决冲突，不必解密。 */
  var META = ['id', 'createdAt', 'updatedAt', 'deviceId', 'rev', 'deletedAt'];

  /* 从聊天窗口或网页上复制密钥时，很容易带进换行和缩进空格。它们混进
     HTTP 头会让请求当场失效，而服务器只回一句「Invalid API key」——
     几乎没人能联想到是这个原因。这里统一清掉：密钥类字段去掉全部空白，
     口令类只削首尾（口令里可能有意留空格）。 */
  function squeeze(s) { return String(s == null ? '' : s).replace(/\s+/g, ''); }
  function trimEdge(s) { return String(s == null ? '' : s).replace(/^\s+|\s+$/g, ''); }

  /* ===========================================================
     配置
     =========================================================== */
  var _cfg = null;
  function config() {
    if (_cfg) return _cfg;
    var o = {};
    try { o = JSON.parse(global.localStorage.getItem(CFGKEY) || '{}') || {}; } catch (e) { o = {}; }
    _cfg = {
      url: squeeze(o.url).replace(/\/+$/, ''),
      anon: squeeze(o.anon),
      pass: trimEdge(o.pass),
      /* 邮箱只是个预填项，省得第二台设备再手打一遍 */
      email: squeeze(o.email),
      auto: o.auto !== false
    };
    return _cfg;
  }

  function saveConfig(patch) {
    var c = config();
    Object.keys(patch || {}).forEach(function (k) { c[k] = patch[k]; });
    /* 存进去之前先归一化 —— 落库的永远是不含杂质的版本，
       脏数据只可能存在于「刚粘进输入框、还没保存」的那一瞬间。 */
    c.url = squeeze(c.url).replace(/\/+$/, '');
    c.anon = squeeze(c.anon);
    c.email = squeeze(c.email);
    if (c.pass != null) c.pass = trimEdge(c.pass);
    try { global.localStorage.setItem(CFGKEY, JSON.stringify(c)); } catch (e) { /* 忽略写入失败 */ }
    keyCache = null;   // 口令可能变了，密钥缓存作废
    return c;
  }

  /* ===========================================================
     登录态
     =========================================================== */
  var _auth = null;
  function auth() {
    if (_auth === null) {
      try { _auth = JSON.parse(global.localStorage.getItem(AUTHKEY) || 'null'); } catch (e) { _auth = null; }
    }
    return _auth;
  }
  function saveAuth(a) {
    _auth = a || null;
    try {
      if (a) global.localStorage.setItem(AUTHKEY, JSON.stringify(a));
      else global.localStorage.removeItem(AUTHKEY);
    } catch (e) { /* 忽略写入失败 */ }
  }

  function configured() {
    var c = config();
    return !!(c.url && c.anon && c.pass);
  }
  function connected() {
    return configured() && !!auth() && !!auth().access_token;
  }

  /* ===========================================================
     状态与订阅
     =========================================================== */
  var state = { phase: 'off', text: '未启用同步', at: 0, broken: 0, healed: 0, dangling: 0, brokenList: [], error: '' };
  var listeners = [];

  function setState(patch) {
    Object.keys(patch || {}).forEach(function (k) { state[k] = patch[k]; });
    listeners.forEach(function (fn) {
      try { fn(state); } catch (e) { /* 单个订阅者出错不影响其他人 */ }
    });
  }
  function onChange(fn) { if (typeof fn === 'function') listeners.push(fn); }
  function getState() { return state; }

  function refreshIdleState() {
    if (!configured()) { setState({ phase: 'off', text: '未启用同步', error: '' }); return; }
    if (!connected()) { setState({ phase: 'off', text: '未登录', error: '' }); return; }
    setState({ phase: 'idle', text: '已连接', error: '' });
  }

  /* ===========================================================
     HTTP
     =========================================================== */
  function http(url, opts) {
    opts = opts || {};
    var c = config();
    var headers = { 'Content-Type': 'application/json' };
    Object.keys(opts.headers || {}).forEach(function (k) { headers[k] = opts.headers[k]; });
    /* 再兜一次底：配置层已经清过了，但这里直接决定请求成败，
       万一有别处绕过 saveConfig 写进脏值，也不让它毁掉整轮同步。 */
    var key = squeeze(c.anon);
    if (key) headers.apikey = key;
    if (opts.token) headers.Authorization = 'Bearer ' + squeeze(opts.token);
    else if (opts.authAnon !== false && key) headers.Authorization = 'Bearer ' + key;

    var init = { method: opts.method || 'GET', headers: headers };
    if (opts.body !== undefined) init.body = JSON.stringify(opts.body);

    return fetch(url, init).then(function (res) {
      return res.text().then(function (text) {
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
        if (!res.ok) {
          var msg = (data && (data.msg || data.message || data.error_description || data.error)) || ('HTTP ' + res.status);
          msg = String(msg);
          /* 这两个错误最容易被误判成「账号错了」「网络坏了」，其实
             八成是密钥没粘全或多粘了东西。把排查方向直接写进提示里。 */
          if (/invalid api key|invalid_api_key|no api key/i.test(msg)) {
            msg = '匿名密钥无效。多半是复制时漏了字符，或带进了换行/空格 —— ' +
              '请把密钥重新完整粘一遍（现在粘贴会自动清理空白）。';
          } else if (/jwt|token is expired|invalid claim/i.test(msg) && res.status === 401) {
            msg = '登录已过期，重新点一次「登录并启用」即可。';
          }
          var err = new Error(msg);
          err.status = res.status;
          throw err;
        }
        return data;
      });
    });
  }

  /* ---------- 注册 / 登录 ---------- */
  function adoptSession(data) {
    if (!data || !data.access_token) throw new Error('登录响应里没有凭据');
    var a = {
      access_token: data.access_token,
      refresh_token: data.refresh_token || '',
      expires_at: Date.now() + ((+data.expires_in || 3600) - 60) * 1000,
      email: (data.user && data.user.email) || ''
    };
    saveAuth(a);
    return a;
  }

  function signUp(email, password) {
    var c = config();
    if (!c.url || !c.anon) return Promise.reject(new Error('请先填写后端地址和匿名密钥'));
    return http(c.url + '/auth/v1/signup', {
      method: 'POST', authAnon: false,
      body: { email: email, password: password }
    }).then(function (data) {
      /* 关掉了邮箱确认时，注册会直接返回凭据；否则要等用户去邮箱点链接。 */
      if (data && data.access_token) { adoptSession(data); return { needConfirm: false }; }
      return { needConfirm: true };
    });
  }

  function signIn(email, password) {
    var c = config();
    if (!c.url || !c.anon) return Promise.reject(new Error('请先填写后端地址和匿名密钥'));
    return http(c.url + '/auth/v1/token?grant_type=password', {
      method: 'POST', authAnon: false,
      body: { email: email, password: password }
    }).then(function (data) { adoptSession(data); return { needConfirm: false }; });
  }

  function refreshSession() {
    var c = config(), a = auth();
    if (!a || !a.refresh_token) return Promise.reject(new Error('登录已过期，请重新登录'));
    return http(c.url + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', authAnon: false,
      body: { refresh_token: a.refresh_token }
    }).then(function (data) { adoptSession(data); return data.access_token; });
  }

  function ensureToken() {
    var a = auth();
    if (!a || !a.access_token) return Promise.reject(new Error('尚未登录'));
    if (a.expires_at && a.expires_at > Date.now()) return Promise.resolve(a.access_token);
    return refreshSession();
  }

  function signOut() {
    saveAuth(null);
    refreshIdleState();
  }

  /* ===========================================================
     密钥
     =========================================================== */
  var keyCache = null;
  function getKey() {
    var c = config();
    if (keyCache && keyCache.pass === c.pass) return Promise.resolve(keyCache.key);
    return Vault.deriveKey(c.pass).then(function (key) {
      keyCache = { pass: c.pass, key: key };
      return key;
    });
  }
  function keyFingerprint() {
    return getKey().then(function (k) { return Vault.fingerprint(k); });
  }

  /* ===========================================================
     封装 / 拆封
     壳上留 id、时间、设备、版本；内容整体加密成一个字符串。
     =========================================================== */
  function seal(kind, item, key) {
    var secret = {};
    Object.keys(item).forEach(function (k) {
      if (META.indexOf(k) < 0) secret[k] = item[k];
    });
    return Vault.encrypt(key, JSON.stringify(secret)).then(function (env) {
      return {
        doc: kind + ':' + item.id,
        kind: kind,
        item_id: item.id,
        created_at: +item.createdAt || 0,
        updated_at: +item.updatedAt || 0,
        device_id: String(item.deviceId || ''),
        rev: +item.rev || 1,
        deleted_at: +item.deletedAt || 0,
        env: env
      };
    });
  }

  function open(row, key) {
    return Vault.decrypt(key, row.env).then(function (text) {
      var item = {};
      try { item = JSON.parse(text) || {}; } catch (e) { item = {}; }
      item.id = row.item_id;
      item.createdAt = +row.created_at || 0;
      item.updatedAt = +row.updated_at || 0;
      item.deviceId = row.device_id || '';
      item.rev = +row.rev || 1;
      item.deletedAt = +row.deleted_at || 0;
      return { doc: row.doc, kind: row.kind, item: item };
    });
  }

  /* 个别行解不开（比如换过口令时留下的旧密文）不该让整轮同步失败，
     单独挑出来报告，其余照常合并。 */
  function openAll(rows, key) {
    var broken = [];
    return Promise.all((rows || []).map(function (row) {
      return open(row, key).catch(function () { broken.push(row.doc); return null; });
    })).then(function (list) {
      return { rows: list.filter(Boolean), broken: broken };
    });
  }

  /* ===========================================================
     合并裁决（纯函数，不碰网络，便于单独验证）
       本地有、远端无          → 推上去
       两边都有，本地版本更新   → 推上去
       两边都有，远端版本更新   → 落到本地
       远端墓碑、本地没有       → 本机从未见过，忽略；
                                但若本地已彻底清理过它，顺手把远端那行也删掉
     =========================================================== */
  function reconcile(local, remote, brokenDocs) {
    var localMap = {}, remoteMap = {};
    (local || []).forEach(function (r) { localMap[r.kind + ':' + r.item.id] = r; });
    (remote || []).forEach(function (r) { remoteMap[r.doc] = r; });

    /* 解不开的远端行要当成「远端根本没有这一条」，而不是「版本相同、无需处理」。
       区别是决定性的：当成「相同」的话，本机那份永远不会被重新推上去，
       云端那行就永远锁着 —— 症状是「这条内容本机看得见，另一台设备永远看不到」，
       而且两边都不报错，只报「解不开」。当成「没有」，本机版本就会用当前口令
       重新加密推上去，把那条读不了的旧密文覆盖掉，两边自动恢复一致。 */
    var brokenSet = {};
    (brokenDocs || []).forEach(function (d) { brokenSet[d] = true; });

    var toApply = [], toPush = [], toDrop = [], healed = [];

    Object.keys(localMap).forEach(function (doc) {
      var l = localMap[doc];
      if (brokenSet[doc]) { toPush.push(l); healed.push(doc); return; }

      var r = remoteMap[doc];
      if (!r) { toPush.push(l); return; }

      /* 出厂示例内容（带 demo 标记）特殊处理。
         它的 ID 是写死的，所以每台设备第一次打开都会自带一份，而时间戳是「刚刚」——
         比用户在另一台设备上的任何改动都新。若放任 LWW 裁决，先上线的那台
         会把「出厂默认」当成更权威的版本，症状有两个：删掉的示例自己长回来、
         改过的示例退回原文（哪台先同步，症状就在哪一边）。

         所以这里不看时间，只看「谁被人动过」：
           一方原封未动、另一方被用户改过或删过 → 被人动过的那份永远胜出。
         两边都动过或都没动过，才回到常规 LWW。
         判别依据是 rev：出厂示例落库时是 1，用户改一次就 ≥2；删除也会 bump。 */
      if (l.item.demo && r.item.demo) {
        var lTouched = (+l.item.rev || 1) > 1 || !!l.item.deletedAt;
        var rTouched = (+r.item.rev || 1) > 1 || !!r.item.deletedAt;
        if (lTouched !== rTouched) {
          if (!lTouched) { toApply.push({ kind: r.kind, item: r.item }); return; }
          toPush.push(l); return;
        }
      }

      var cmp = DB.compareVersion(l.item, r.item);
      if (cmp > 0) toPush.push(l);
      else if (cmp < 0) toApply.push({ kind: r.kind, item: r.item });
    });

    Object.keys(remoteMap).forEach(function (doc) {
      if (localMap[doc]) return;
      var r = remoteMap[doc];
      if (r.item.deletedAt) {
        if (DB.hasGrave && DB.hasGrave(doc)) toDrop.push(doc);
        return;
      }
      toApply.push({ kind: r.kind, item: r.item });
    });

    /* 解不开、且本机也没有那份 —— 本机帮不上忙，只能如实报告，
       得等「手里有这条内容的那台设备」用正确口令重新推上来。 */
    var dangling = (brokenDocs || []).filter(function (d) { return !localMap[d]; });

    return { toApply: toApply, toPush: toPush, toDrop: toDrop, healed: healed, dangling: dangling };
  }

  /* ===========================================================
     远端读写
     =========================================================== */
  function pullRows(token) {
    var c = config();
    var q = c.url + '/rest/v1/' + TABLE +
      '?select=doc,kind,item_id,created_at,updated_at,device_id,rev,deleted_at,env&limit=10000';
    return http(q, { token: token }).then(function (rows) {
      return Array.isArray(rows) ? rows : [];
    });
  }

  function pushRows(token, records, key) {
    if (!records.length) return Promise.resolve(0);
    return Promise.all(records.map(function (r) { return seal(r.kind, r.item, key); }))
      .then(function (rows) {
        var chunks = [];
        for (var i = 0; i < rows.length; i += BATCH) chunks.push(rows.slice(i, i + BATCH));
        return chunks.reduce(function (p, chunk) {
          return p.then(function (n) {
            var c = config();
            return http(c.url + '/rest/v1/' + TABLE, {
              method: 'POST', token: token,
              headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
              body: chunk
            }).then(function () { return n + chunk.length; });
          });
        }, Promise.resolve(0));
      });
  }

  function dropRows(token, docs) {
    if (!docs.length) return Promise.resolve(0);
    return docs.reduce(function (p, doc) {
      return p.then(function (n) {
        var c = config();
        return http(c.url + '/rest/v1/' + TABLE + '?doc=eq.' + encodeURIComponent(doc), {
          method: 'DELETE', token: token
        }).then(function () { return n + 1; });
      });
    }, Promise.resolve(0));
  }

  /* ===========================================================
     一轮同步
     =========================================================== */
  var running = false;

  function syncNow(opts) {
    opts = opts || {};
    if (running) return Promise.resolve({ skipped: true });
    if (!configured()) return Promise.reject(new Error('同步尚未配置'));
    if (!connected()) return Promise.reject(new Error('尚未登录'));
    if (!Vault.available()) return Promise.reject(new Error('当前环境不支持加密'));

    running = true;
    if (!opts.quiet) setState({ phase: 'busy', text: '正在同步…', error: '' });

    var key = null, token = null;

    return ensureToken()
      .then(function (tk) {
        token = tk;
        return getKey();
      })
      .then(function (k) {
        key = k;
        return pullRows(token);
      })
      .then(function (rows) { return openAll(rows, key); })
      .then(function (remote) {
        var plan = reconcile(DB.dumpForSync(), remote.rows, remote.broken);
        var applied = DB.applyRemote(plan.toApply);

        return pushRows(token, plan.toPush, key)
          .then(function (pushed) { return dropRows(token, plan.toDrop).then(function () { return pushed; }); })
          .then(function (pushed) {
            running = false;
            setState({
              phase: 'ok', text: '已同步', at: Date.now(), error: '',
              broken: remote.broken.length,
              healed: plan.healed.length,
              dangling: plan.dangling.length,
              brokenList: remote.broken,
              pulled: plan.toApply.length, pushed: pushed,
              lastApplied: applied
            });
            return {
              applied: applied, pushed: pushed, broken: remote.broken.length,
              healed: plan.healed.length, dangling: plan.dangling.length,
              dropped: plan.toDrop.length
            };
          });
      })
      .catch(function (err) {
        running = false;
        setState({ phase: 'error', text: '同步失败', error: String(err && err.message || err) });
        throw err;
      });
  }

  /* ===========================================================
     自动同步：本地改动后延迟推，另加一个定时拉
     =========================================================== */
  var pushTimer = null, pollTimer = null;

  function onLocalChange() {
    if (!config().auto || !connected()) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function () { syncNow({ quiet: true }).catch(function () {}); }, 2500);
  }

  function startAuto() {
    stopAuto();
    if (!config().auto || !connected()) return;
    /* 手机端浏览器随时可能被切走，靠「打开时同步一次 + 期间定时拉」
       比追求长连接更实际，也不会在后台白白耗电。 */
    pollTimer = setInterval(function () {
      if (typeof document !== 'undefined' && document.hidden) return;
      syncNow({ quiet: true }).catch(function () {});
    }, 30000);

    if (typeof document !== 'undefined' && document.addEventListener) {
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) syncNow({ quiet: true }).catch(function () {});
      });
    }
    syncNow({ quiet: true }).catch(function () {});
  }

  function stopAuto() {
    clearTimeout(pushTimer); pushTimer = null;
    clearInterval(pollTimer); pollTimer = null;
  }

  function setAuto(on) {
    saveConfig({ auto: !!on });
    if (on) startAuto(); else stopAuto();
    return config().auto;
  }

  function disconnect() {
    stopAuto();
    signOut();
    setState({ phase: 'off', text: '未启用同步', at: 0, error: '',
      broken: 0, healed: 0, dangling: 0, brokenList: [] });
  }

  /* 清掉「谁都读不了」的云端行。
     只在「本机手里也没有这份内容」时才该用：手上有的话，下一轮同步会自动
     用当前口令把它重新推上去，根本不用删。删掉也不伤数据 —— 手里有那条
     内容的设备下次同步会自己把它补回云端。 */
  function forgetBroken(docs) {
    var list = docs || state.brokenList || [];
    if (!list.length) return Promise.resolve(0);
    if (!connected()) return Promise.reject(new Error('尚未登录'));
    return ensureToken().then(function (tk) {
      return dropRows(tk, list).then(function (n) {
        var left = (state.brokenList || []).filter(function (d) { return list.indexOf(d) < 0; });
        setState({ broken: left.length, dangling: 0, brokenList: left });
        return n;
      });
    });
  }

  global.Sync = {
    config: config, saveConfig: saveConfig,
    configured: configured, connected: connected,
    signUp: signUp, signIn: signIn, signOut: signOut, auth: auth,
    getKey: getKey, keyFingerprint: keyFingerprint,
    seal: seal, open: open, openAll: openAll,
    reconcile: reconcile,
    syncNow: syncNow, setAuto: setAuto, startAuto: startAuto, stopAuto: stopAuto,
    onLocalChange: onLocalChange, disconnect: disconnect, forgetBroken: forgetBroken,
    onChange: onChange, getState: getState, refreshIdleState: refreshIdleState,
    TABLE: TABLE, META: META
  };
})(window);

</script>
<script>
/* ===========================================================
   灵感笔记 · 应用层
   =========================================================== */
(function (global) {
  'use strict';

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  /* ---------- 状态 ---------- */
  var S = {
    view: 'inbox',
    filter: 'all',
    sort: 'new',
    query: '',
    activeTopicId: '',
    activeCardId: '',
    activeArticleId: '',
    openFragId: '',
    showRel: true,
    composeKind: 'frag',      // 'frag' 写灵感 | 'card' 写知识卡片
    composeTopics: [],
    composeSim: [],
    composeSimDismissed: false,
    composeSuggested: '',
    editing: null
  };

  /* ---------- 工具 ---------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function hl(s, q) {
    var t = esc(s);
    if (!q) return t;
    try {
      var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      return t.replace(re, '<mark style="background:#F6ECD2;color:inherit;border-radius:2px;">$1</mark>');
    } catch (e) { return t; }
  }
  function when(ts) {
    var d = Date.now() - ts;
    if (d < 60e3) return '刚刚';
    if (d < 3600e3) return Math.floor(d / 60e3) + ' 分钟前';
    if (d < 86400e3) return Math.floor(d / 3600e3) + ' 小时前';
    if (d < 7 * 86400e3) return Math.floor(d / 86400e3) + ' 天前';
    var dt = new Date(ts);
    return (dt.getMonth() + 1) + '月' + dt.getDate() + '日';
  }
  function dateStr(ts) {
    var dt = new Date(ts);
    var p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return dt.getFullYear() + '-' + p(dt.getMonth() + 1) + '-' + p(dt.getDate());
  }
  function topicById(id) { return DB.get('topic', id); }
  function firstLine(s, n) {
    var t = String(s || '').replace(/\s+/g, ' ').trim();
    return t.length > n ? t.slice(0, n) + '…' : t;
  }

  /* 主题徽章组：支持多主题（卡片可跨主题），无主题时显示「未归类」 */
  function topicBadges(ids, opts) {
    opts = opts || {};
    var max = opts.max || 2;
    var list = (ids || []).map(function (id) { return topicById(id); }).filter(Boolean);
    if (!list.length) return '<span class="card-badge">未归类</span>';
    var shown = list.slice(0, max);
    var out = shown.map(function (t) {
      return '<span class="card-badge" style="color:' + t.hue + ';background:' + hexA(t.hue, 0.12) + '">' + esc(t.name) + '</span>';
    }).join('');
    var rest = list.length - shown.length;
    if (rest > 0) out += '<span class="card-badge" title="' + esc(list.slice(max).map(function (t) { return t.name; }).join('、')) + '">+' + rest + '</span>';
    return out;
  }

  /* ---------- 提示 ---------- */
  function toast(msg, kind) {
    var box = $('#toasts');
    var el = document.createElement('div');
    el.className = 'toast' + (kind ? ' is-' + kind : '');
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(function () {
      el.style.transition = 'opacity .25s, transform .25s';
      el.style.opacity = '0';
      el.style.transform = 'translateY(6px)';
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 280);
    }, 2400);
  }
  function status(left, right) {
    if (left != null) $('#statusLeft').textContent = left;
    if (right != null) $('#statusRight').textContent = right;
  }

  /* ===========================================================
     渲染 · 计数与页签
     =========================================================== */
  function renderCounts() {
    var st = DB.stats();
    var map = { loose: st.loose, topics: st.topics, cards: st.cards, articles: st.articles };
    $$('[data-count]').forEach(function (el) {
      var k = el.getAttribute('data-count');
      el.textContent = map[k] != null ? map[k] : '';
    });
  }

  /* ===========================================================
     渲染 · 灵感列表
     =========================================================== */
  function fragPassesFilter(f) {
    var st = DB.stats();
    if (S.filter === 'star') return !!f.star;
    if (S.filter === 'recent') return Date.now() - f.createdAt < 7 * 86400e3;
    if (S.filter === 'sim') {
      return Engine.findSimilar(f.text, { excludeId: f.id, limit: 1, floor: 0.2 }).length > 0;
    }
    return true;
  }

  function matchFrag(f) {
    if (!S.query) return true;
    var q = S.query.toLowerCase();
    if ((f.text || '').toLowerCase().indexOf(q) >= 0) return true;
    if ((f.tags || []).join(' ').toLowerCase().indexOf(q) >= 0) return true;
    var tn = (f.topicIds || []).map(function (id) { var t = topicById(id); return t ? t.name : ''; }).join(' ');
    if (tn.toLowerCase().indexOf(q) >= 0) return true;
    // 关键词命中
    return Engine.keywords(f.text, 12).some(function (k) { return k.indexOf(q) >= 0; });
  }

  function sortedFrags() {
    var arr = DB.list('frag');
    if (S.view === 'inbox') {
      arr = arr.filter(function (f) { return !(f.topicIds || []).length; });
      if (S.filter === 'all') {
        // 收件箱默认只显示未归类；但「全部」「星标」「近7天」时仍限未归类
      }
    } else if (S.activeTopicId) {
      arr = arr.filter(function (f) { return (f.topicIds || []).indexOf(S.activeTopicId) >= 0; });
    }
    arr = arr.filter(matchFrag).filter(fragPassesFilter);

    if (S.sort === 'old') arr.reverse();
    else if (S.sort === 'sim') {
      arr.sort(function (a, b) {
        var sa = Engine.findSimilar(a.text, { excludeId: a.id, limit: 1, floor: 0 })[0];
        var sb = Engine.findSimilar(b.text, { excludeId: b.id, limit: 1, floor: 0 })[0];
        return (sb ? sb.sim : 0) - (sa ? sa.sim : 0);
      });
    }
    return arr;
  }

  function fragHTML(f) {
    var open = S.openFragId === f.id;
    var topics = (f.topicIds || []).map(function (id) {
      var t = topicById(id);
      return t ? '<span class="frag-tag" style="color:' + t.hue + ';background:' + hexA(t.hue, 0.12) + '">' + esc(t.name) + '</span>' : '';
    }).join('');
    var tags = (f.tags || []).map(function (g) {
      return '<span class="frag-tag">#' + esc(g) + '</span>';
    }).join('');

    var suggest = '';
    if (!(f.topicIds || []).length && S.showRel) {
      var rec = Engine.classify(f.text, f.tags);
      if (rec.topicId) {
        suggest = '<span class="frag-suggest" data-act="accept" data-id="' + f.id + '" title="点击采纳：归入「' + esc(rec.name) + '」">建议归入 · ' + esc(rec.name) + '</span>';
      }
    }

    var links = '';
    if (open && S.showRel) {
      var sims = Engine.findSimilar(f.text, { excludeId: f.id, limit: 4, floor: 0.16 });
      if (sims.length) {
        links = '<div class="frag-links"><div class="frag-links-title">与之相近的内容 · 可直接迭代</div>' +
          sims.map(function (s) {
            return '<div class="frag-link" data-act="goto" data-kind="' + s.kind + '" data-id="' + s.item.id + '">' +
              '<span class="lk-t">' + esc(firstLine(s.item.text || s.item.title, 52)) + '</span>' +
              '<span class="lk-s">' + (s.kind === 'card' ? '卡片' : '灵感') + ' · ' + Math.round(s.sim * 100) + '%</span>' +
              '</div>';
          }).join('') + '</div>';
      }
      var refs = DB.refsOf('card', f.id);
      var created = DB.load().cards.filter(function (c) { return c.sourceIds.indexOf(f.id) >= 0; });
      if (created.length) {
        links += '<div class="frag-links"><div class="frag-links-title">已聚合进卡片</div>' +
          created.map(function (c) {
            return '<div class="frag-link" data-act="goto" data-kind="card" data-id="' + c.id + '">' +
              '<span class="lk-t">' + esc(c.title) + '</span><span class="lk-s">卡片</span></div>';
          }).join('') + '</div>';
      }
    }

    return '<article class="frag' + (open ? ' is-open' : '') + (f.star ? ' is-star' : '') + '" data-id="' + f.id + '">' +
      '<div class="frag-text">' + hl(f.text, S.query) + '</div>' +
      '<div class="frag-foot">' + topics + tags + suggest +
        '<span class="frag-time">' + when(f.createdAt) + '</span>' +
      '</div>' +
      links +
      '<div class="frag-actions">' +
        '<button class="btn btn-sm btn-ghost" data-act="card" data-id="' + f.id + '">聚合为卡片</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="edit" data-id="' + f.id + '">编辑</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="star" data-id="' + f.id + '">' + (f.star ? '取消星标' : '星标') + '</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="copy" data-id="' + f.id + '">复制</button>' +
        '<button class="btn btn-sm btn-ghost btn-danger" data-act="del" data-id="' + f.id + '">删除</button>' +
      '</div>' +
    '</article>';
  }

  function hexA(hex, a) {
    var h = String(hex || '#C0824E').replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  function renderFrags() {
    var list = sortedFrags();
    var host = $('#primaryList');
    if (!list.length) {
      host.innerHTML = emptyHTML();
      return;
    }
    var groups = {};
    var order = [];
    list.forEach(function (f) {
      var key;
      if (S.view === 'inbox') key = '';
      else {
        var t = (f.topicIds || []).map(function (id) { return topicById(id); }).filter(Boolean)[0];
        key = t ? t.name : '未归类';
      }
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push(f);
    });

    var html = '';
    order.forEach(function (key) {
      if (key) html += '<div class="group-head">' + esc(key) + '</div>';
      html += groups[key].map(fragHTML).join('');
    });
    host.innerHTML = html;
  }

  function emptyHTML() {
    var msgs = {
      inbox: ['收件箱是空的', '所有灵感都已归入主题。新的念头随时写下来。'],
      topics: ['还没有选定主题', '在右侧选择一个主题，打开它的整理台。'],
      cards: ['还没有知识卡片', '可以直接写一张，也可以在灵感上点「聚合为卡片」。'],
      articles: ['还没有文章', '把几张相关的卡片组织起来，就成了一篇文章。']
    };
    var m = msgs[S.view] || ['这里还是空的', '开始记录第一条灵感吧。'];
    if (S.query) m = ['没有匹配「' + S.query + '」的内容', '换个关键词试试，或清空搜索。'];
    var btn = S.query
      ? '<button class="btn btn-ghost" style="margin-top:14px" data-act="clearSearch">清空搜索</button>'
      : S.view === 'cards'
        ? '<button class="btn btn-ghost" style="margin-top:14px" data-act="newCard">＋ 新建卡片</button>'
        : S.view === 'articles'
          ? '<button class="btn btn-ghost" style="margin-top:14px" data-act="composeNow">去记一条灵感</button>'
          : '<button class="btn btn-ghost" style="margin-top:14px" data-act="composeNow">记下第一条灵感</button>';
    return '<div class="empty"><div class="empty-mark"></div>' +
      '<p class="empty-title">' + esc(m[0]) + '</p><p class="empty-sub">' + esc(m[1]) + '</p>' + btn + '</div>';
  }

  /* ===========================================================
     渲染 · 右侧面板
     =========================================================== */
  function renderSecondary() {
    if (S.view === 'inbox' || S.view === 'topics') renderTopicPanel();
    else if (S.view === 'cards') renderCardPanel();
    else renderArticlePanel();
  }

  function renderTopicPanel() {
    $('#secondaryTitle').textContent = '主题脉络';
    $('#secondarySub').textContent = '灵感按主题自动聚拢，点击可查看';

    var topics = DB.list('topic');
    var frags = DB.load().frags;
    var cards = DB.load().cards;

    var html = '';
    // 自动归类建议区
    var loose = frags.filter(function (f) { return !(f.topicIds || []).length; });
    if (loose.length && topics.length) {
      var sugs = Engine.suggestForLoose(3);
      if (sugs.length) {
        html += '<div class="sim-block"><div class="sim-head">' +
          '<svg class="ico" viewBox="0 0 16 16"><path d="M8 1.5 L9.8 6.2 L14.5 8 L9.8 9.8 L8 14.5 L6.2 9.8 L1.5 8 L6.2 6.2 Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>' +
          '待归类的灵感 · 建议目的地' +
          '<button class="btn btn-sm btn-ghost" style="margin-left:auto" data-act="acceptAll" type="button">全部采纳</button></div>' +
          sugs.map(function (s) {
            return '<div class="sim-item">' +
              '<span class="sim-item-text">' + esc(firstLine(s.frag.text, 46)) + '</span>' +
              '<span class="sim-score">' + Math.round(Math.min(1, s.rec.score) * 100) + '%</span>' +
              '<span class="sim-item-actions">' +
                '<button class="btn btn-sm btn-ghost" data-act="accept" data-id="' + s.frag.id + '" data-topic="' + s.rec.topicId + '">归入 ' + esc(s.rec.name) + '</button>' +
              '</span></div>';
          }).join('') +
          (loose.length > sugs.length ? '<div class="frag-links-title" style="margin-top:8px">还有 ' + (loose.length - sugs.length) + ' 条信号不足，保留在收件箱</div>' : '') +
        '</div>';
      }
    }

    if (!topics.length) {
      html += '<div class="empty"><div class="empty-mark"></div>' +
        '<p class="empty-title">还没有主题</p><p class="empty-sub">主题是你亲手整理的桌子。创建一个，然后把灵感和卡片挑进去。</p>' +
        '<button class="btn btn-ghost" style="margin-top:14px;" data-act="newTopic">新建主题</button></div>';
      $('#secondaryList').innerHTML = html;
      return;
    }

    topics.forEach(function (t) {
      var own = frags.filter(function (f) { return (f.topicIds || []).indexOf(t.id) >= 0; });
      var ownCards = cards.filter(function (c) { return (c.topicIds || []).indexOf(t.id) >= 0; });
      var arts = DB.load().articles.filter(function (a) { return a.topicId === t.id; });
      var per = Math.min(100, own.length * 14 + ownCards.length * 20);
      var active = S.activeTopicId === t.id;
      html += '<div class="topic' + (active ? ' is-active' : '') + '" data-act="pickTopic" data-id="' + t.id + '">' +
        '<button class="row-del" type="button" data-act="delTopic" data-id="' + t.id + '" aria-label="删除主题" title="删除主题">' +
        '<svg class="ico" viewBox="0 0 16 16"><path d="M3 4.5 H13 M6.5 4.5 V3.2 H9.5 V4.5 M5 4.5 L5.6 13 H10.4 L11 4.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
        '<div class="topic-row">' +
          '<span class="topic-hue" style="background:' + t.hue + '"></span>' +
          '<span class="topic-name">' + esc(t.name) + '</span>' +
        '</div>' +
        (t.desc ? '<p class="topic-desc">' + esc(t.desc) + '</p>' : '') +
        '<div class="topic-stats">' +
          '<span><b>' + own.length + '</b> 条灵感</span>' +
          '<span><b>' + ownCards.length + '</b> 张卡片</span>' +
          '<span><b>' + arts.length + '</b> 篇文章</span>' +
        '</div>' +
        '<div class="topic-meter"><i style="width:' + per + '%;background:' + t.hue + '"></i></div>' +
        ((t.keywords || []).length ? '<div class="topic-keywords">' +
          t.keywords.slice(0, 7).map(function (k) { return '<span class="kw">' + esc(k) + '</span>'; }).join('') +
          '</div>' : '') +
      '</div>';
    });

    html += '<button class="btn btn-ghost" style="width:100%;justify-content:center;margin-top:4px;" data-act="newTopic">＋ 新建主题</button>';
    $('#secondaryList').innerHTML = html;
  }

  function renderCardPanel() {
    $('#secondaryTitle').textContent = '知识卡片';
    $('#secondarySub').textContent = '可以直接记录，也可以由灵感聚合';
    var cards = DB.list('card');
    if (!cards.length) {
      $('#secondaryList').innerHTML = '<div class="empty"><div class="empty-mark"></div>' +
        '<p class="empty-title">还没有卡片</p><p class="empty-sub">直接写一张，或打开灵感点「聚合为卡片」。</p>' +
        '<button class="btn btn-ghost" style="margin-top:14px" data-act="newCard">＋ 新建卡片</button></div>';
      return;
    }
    var html = cards.map(function (c) {
      var src = DB.sourcesOf('card', c.id);
      return '<div class="topic' + (S.activeCardId === c.id ? ' is-active' : '') + '" data-act="pickCard" data-id="' + c.id + '">' +
        '<button class="row-del" type="button" data-act="delCard" data-id="' + c.id + '" aria-label="删除卡片" title="删除卡片">' +
        '<svg class="ico" viewBox="0 0 16 16"><path d="M3 4.5 H13 M6.5 4.5 V3.2 H9.5 V4.5 M5 4.5 L5.6 13 H10.4 L11 4.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
        '<div class="card-item-top">' +
          '<span class="badge-set">' + topicBadges(c.topicIds, { max: 2 }) + '</span>' +
          '<span class="frag-time" style="margin-left:auto;font-size:11px;color:var(--ink-4)">' + when(c.updatedAt) + '</span>' +
        '</div>' +
        '<h3 class="card-title">' + esc(c.title) + '</h3>' +
        '<p class="topic-desc" style="margin-top:6px">' + esc(firstLine(c.body, 68)) + '</p>' +
        '<div class="topic-stats"><span>' + (src.length ? '来源 <b>' + src.length + '</b> 条' : '直接记录') + '</span>' +
          '<span>被引用 <b>' + DB.refsOf('card', c.id).length + '</b> 次</span></div>' +
      '</div>';
    }).join('');
    html += '<button class="btn btn-ghost" style="width:100%;justify-content:center;margin-top:4px;" data-act="newCard">＋ 新建卡片</button>';
    $('#secondaryList').innerHTML = html;
  }

  function renderArticlePanel() {
    $('#secondaryTitle').textContent = '文章';
    $('#secondarySub').textContent = '由卡片与灵感组织成稿';
    var arts = DB.list('article');
    var html = arts.map(function (a) {
      var t = topicById(a.topicId);
      return '<div class="topic' + (S.activeArticleId === a.id ? ' is-active' : '') + '" data-act="pickArticle" data-id="' + a.id + '">' +
        '<button class="row-del" type="button" data-act="delArticle" data-id="' + a.id + '" aria-label="删除文章" title="删除文章">' +
        '<svg class="ico" viewBox="0 0 16 16"><path d="M3 4.5 H13 M6.5 4.5 V3.2 H9.5 V4.5 M5 4.5 L5.6 13 H10.4 L11 4.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
        '<div class="card-item-top">' +
          (t ? '<span class="card-badge" style="color:' + t.hue + ';background:' + hexA(t.hue, 0.12) + '">' + esc(t.name) + '</span>' : '<span class="card-badge">未归类</span>') +
          '<span class="frag-time" style="margin-left:auto;font-size:11px;color:var(--ink-4)">' + when(a.updatedAt) + '</span>' +
        '</div>' +
        '<h3 class="card-title">' + esc(a.title) + '</h3>' +
        '<div class="topic-stats"><span>素材 <b>' + (a.sourceIds || []).length + '</b> 条</span>' +
        '<span><b>' + (a.body || '').replace(/\s/g, '').length + '</b> 字</span></div>' +
      '</div>';
    }).join('');
    html += '<button class="btn btn-ghost" style="width:100%;justify-content:center;margin-top:4px;" data-act="newArticle">＋ 新建文章</button>';
    $('#secondaryList').innerHTML = html;
  }

  /* ===========================================================
     渲染 · 主区标题
     =========================================================== */
  function renderPrimaryHead() {
    var titles = {
      inbox: ['收件箱', '未归类的灵感会留在这里，随时可以聚合'],
      topics: ['主题', '点右侧任一主题，打开它的整理台'],
      cards: ['知识卡片', '可以直接记录，也可以从灵感聚合'],
      articles: ['文章', '点击卡片继续写作']
    };
    if (S.view === 'cards' || S.view === 'articles') {
      // 卡片与文章在主区用列表呈现
      var t = titles[S.view];
      $('#primaryTitle').textContent = t[0];
      $('#primarySub').textContent = t[1];
      return;
    }
    if (S.activeTopicId && S.view === 'topics') {
      var topic = topicById(S.activeTopicId);
      if (topic) {
        var ct = DB.topicContents(topic.id);
        $('#primaryTitle').textContent = topic.name;
        $('#primarySub').textContent = (topic.desc ? topic.desc + ' · ' : '') +
          ct.frags.length + ' 条灵感 · ' + ct.cards.length + ' 张卡片 · ' + ct.articles.length + ' 篇文章';
        return;
      }
    }

    $('#primaryTitle').textContent = t2[0];
    $('#primarySub').textContent = t2[1];
  }

  /* ===========================================================
     主题工作台：把灵感与卡片收纳进一个主题
     =========================================================== */

    // 工具栏
    html += '<div class="wb-bar">' +
      '<button class="btn btn-primary btn-sm" type="button" data-act="openCollect" data-id="' + topic.id + '">＋ 添加内容</button>' +
      '<button class="btn btn-sm btn-ghost" type="button" data-act="editTopic" data-id="' + topic.id + '">编辑主题</button>' +
      '<span class="wb-count">共 ' + (ct.frags.length + ct.cards.length) + ' 项</span>' +
      '</div>';

    // 灵感段
    html += '<div class="wb-sec"><div class="wb-sec-head">灵感 <b>' + ct.frags.length + '</b>' +
      '<button class="btn btn-sm btn-ghost" type="button" data-act="openCollect" data-id="' + topic.id + '" data-tab="frag">添加</button>' +
      '</div>';
    if (ct.frags.length) {
      html += ct.frags.map(function (f) {
        return '<div class="wb-item" data-act="goto" data-kind="frag" data-id="' + f.id + '">' +
          '<span class="wb-item-text">' + esc(firstLine(f.text, 60)) + '</span>' +
          '<button class="icon-btn wb-unlink" type="button" data-act="pullOut" data-kind="frag" data-id="' + f.id + '" title="移出本主题" aria-label="移出本主题">' +
          '<svg class="ico" viewBox="0 0 16 16"><path d="M4 4 L12 12 M12 4 L4 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>' +
          '</div>';
      }).join('');
    } else {
      html += '<p class="wb-empty">还没有灵感归入这个主题。</p>';
    }
    html += '</div>';

    // 卡片段
    html += '<div class="wb-sec"><div class="wb-sec-head">知识卡片 <b>' + ct.cards.length + '</b>' +
      '<button class="btn btn-sm btn-ghost" type="button" data-act="openCollect" data-id="' + topic.id + '" data-tab="card">添加</button>' +
      '</div>';
    if (ct.cards.length) {
      html += ct.cards.map(function (c) {
        var others = (c.topicIds || []).filter(function (x) { return x !== topic.id; });
        return '<div class="wb-item" data-act="goto" data-kind="card" data-id="' + c.id + '">' +
          '<span class="wb-item-text"><b>' + esc(firstLine(c.title, 40)) + '</b>' +
          (others.length ? '<span class="wb-also">也在 ' + esc(others.map(function (x) { var t = topicById(x); return t ? t.name : ''; }).filter(Boolean).join('、')) + '</span>' : '') +
          '</span>' +
          '<button class="icon-btn wb-unlink" type="button" data-act="pullOut" data-kind="card" data-id="' + c.id + '" title="移出本主题" aria-label="移出本主题">' +
          '<svg class="ico" viewBox="0 0 16 16"><path d="M4 4 L12 12 M12 4 L4 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>' +
          '</div>';
      }).join('');
    } else {
      html += '<p class="wb-empty">还没有卡片归入这个主题。</p>';
    }
    html += '</div>';

    // 文章段
    html += '<div class="wb-sec"><div class="wb-sec-head">文章 <b>' + ct.articles.length + '</b>' +
      '<button class="btn btn-sm btn-ghost" type="button" data-act="writeFromTopic" data-id="' + topic.id + '">以此为素材写文章</button>' +
      '</div>';
    if (ct.articles.length) {
      html += ct.articles.map(function (a) {
        return '<div class="wb-item" data-act="goto" data-kind="article" data-id="' + a.id + '">' +
          '<span class="wb-item-text">' + esc(a.title) + '</span></div>';
      }).join('');
    } else {
      html += '<p class="wb-empty">还没有文章从这里长出来。</p>';
    }
    html += '</div>';

    $('#primaryList').innerHTML = html;
  }

  /* 收纳面板：从全库勾选灵感与卡片，批量归入主题。
     勾选状态直接读 DOM 复选框，不回写 S —— 单一数据源，避免两份状态漂移。 */
  function openCollect(topicId, tab) {
    var topic = topicById(topicId);
    if (!topic) return;
    var d = DB.load();
    var inF = DB.fragsOfTopic(topicId).map(function (f) { return f.id; });
    var inC = DB.cardsOfTopic(topicId).map(function (c) { return c.id; });
    S._collect = { topicId: topicId, tab: tab || 'all' };

    var looseF = d.frags.filter(function (f) { return inF.indexOf(f.id) < 0; })
      .sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    var looseC = d.cards.filter(function (c) { return inC.indexOf(c.id) < 0; })
      .sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });

    var html = '<div class="collect-head">把内容放进「' + esc(topic.name) + '」' +
      '<span class="collect-sub">已勾选 ' + (inF.length + inC.length) + ' 项，选中即可归入</span></div>';

    html += '<div class="collect-tabs">' +
      '<button class="chip' + (S._collect.tab === 'all' ? ' is-on' : '') + '" type="button" data-act="collectTab" data-tab="all">全部</button>' +
      '<button class="chip' + (S._collect.tab === 'frag' ? ' is-on' : '') + '" type="button" data-act="collectTab" data-tab="frag">灵感 ' + looseF.length + '</button>' +
      '<button class="chip' + (S._collect.tab === 'card' ? ' is-on' : '') + '" type="button" data-act="collectTab" data-tab="card">卡片 ' + looseC.length + '</button>' +
      '</div>';

    html += '<div class="collect-list">';

    if (S._collect.tab !== 'card') {
      html += '<div class="collect-group">灵感 · 已在主题内的 ' + inF.length + ' 条</div>';
      if (!d.frags.length) html += '<p class="wb-empty">还没有灵感。</p>';
      d.frags.slice().sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); }).forEach(function (f) {
        var on = inF.indexOf(f.id) >= 0;
        html += '<label class="collect-row' + (on ? ' is-in' : '') + '">' +
          '<input type="checkbox" data-act="collectPick" data-kind="frag" data-id="' + f.id + '"' + (on ? ' checked' : '') + '>' +
          '<span class="collect-text">' + esc(firstLine(f.text, 62)) + '</span>' +
          (on ? '<span class="collect-tag">已在</span>' : '') +
          '</label>';
      });
    }

    if (S._collect.tab !== 'frag') {
      html += '<div class="collect-group">知识卡片 · 已在主题内的 ' + inC.length + ' 张</div>';
      if (!d.cards.length) html += '<p class="wb-empty">还没有卡片。</p>';
      d.cards.slice().sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); }).forEach(function (c) {
        var on = inC.indexOf(c.id) >= 0;
        html += '<label class="collect-row' + (on ? ' is-in' : '') + '">' +
          '<input type="checkbox" data-act="collectPick" data-kind="card" data-id="' + c.id + '"' + (on ? ' checked' : '') + '>' +
          '<span class="collect-text"><b>' + esc(firstLine(c.title, 38)) + '</b>' +
          (on ? '' : '<span class="collect-hint">' + esc(firstLine(c.body, 30)) + '</span>') + '</span>' +
          (on ? '<span class="collect-tag">已在</span>' : '') +
          '</label>';
      });
    }

    html += '</div>';

    $('#collectBody').innerHTML = html;
    $('#collectTitle').textContent = '添加内容到主题';
    $('#collectFootHint').textContent = '已选中 ' + (inF.length + inC.length) + ' 项';
    $('#collectMask').hidden = false;
  }

  function refreshCollect() {
    var c = S._collect;
    if (!c) return;
    var pick = { frag: [], card: [] };
    $('#collectBody').querySelectorAll('[data-act="collectPick"]').forEach(function (cb) {
      if (cb.checked) pick[cb.getAttribute('data-kind')].push(cb.getAttribute('data-id'));
    });

    /* 全量对齐：以面板上的勾选状态为最终结果，多退少补。
       走 DB 的批量接口而不是就地改对象 —— 归属变化需要被正当记录下来
       （盖上版本戳），否则将来同步时这次改动传达不到另一台设备。 */
    var add = [], out = [];
    ['frag', 'card'].forEach(function (kind) {
      var now = kind === 'frag' ? DB.fragsOfTopic(c.topicId) : DB.cardsOfTopic(c.topicId);
      var has = {}, want = {};
      now.forEach(function (x) { has[x.id] = true; });
      pick[kind].forEach(function (id) { want[id] = true; });
      Object.keys(want).forEach(function (id) { if (!has[id]) add.push({ kind: kind, id: id }); });
      Object.keys(has).forEach(function (id) { if (!want[id]) out.push({ kind: kind, id: id }); });
    });
    DB.addToTopic(c.topicId, add);
    DB.removeFromTopic(c.topicId, out);

    var nf = pick.frag.length, ncd = pick.card.length;
    $('#collectFootHint').textContent = '本主题现有 ' + (nf + ncd) + ' 项（灵感 ' + nf + ' · 卡片 ' + ncd + '）';
  }

  function renderCardsPrimary() {
    var cards = DB.list('card');
    if (S.query) {
      var q = S.query.toLowerCase();
      cards = cards.filter(function (c) {
        return (c.title + ' ' + c.body).toLowerCase().indexOf(q) >= 0;
      });
    }
    if (!cards.length) { $('#primaryList').innerHTML = emptyHTML(); return; }
    var bar = '<div class="wb-bar">' +
      '<button class="btn btn-ghost" type="button" data-act="newCard">' +
        '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.2 V12.8 M3.2 8 H12.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
        '新建卡片</button>' +
      '<span class="wb-count">' + (S.query ? cards.length + ' 条匹配' : '共 ' + cards.length + ' 张卡片') + '</span>' +
      '</div>';
    $('#primaryList').innerHTML = bar + cards.map(function (c) {
      var src = DB.sourcesOf('card', c.id);
      var refs = DB.refsOf('card', c.id);
      return '<div class="card-item" data-act="openCard" data-id="' + c.id + '">' +
        '<button class="row-del" type="button" data-act="delCard" data-id="' + c.id + '" aria-label="删除卡片" title="删除卡片">' +
        '<svg class="ico" viewBox="0 0 16 16"><path d="M3 4.5 H13 M6.5 4.5 V3.2 H9.5 V4.5 M5 4.5 L5.6 13 H10.4 L11 4.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
        '<div class="card-item-top">' +
          '<span class="badge-set">' + topicBadges(c.topicIds, { max: 3 }) + '</span>' +
          '<span style="margin-left:auto;font-size:11px;color:var(--ink-4)">' + when(c.updatedAt) + '</span>' +
        '</div>' +
        '<h3 class="card-title">' + hl(c.title, S.query) + '</h3>' +
        '<div class="card-body" style="margin-top:8px">' + hl(c.body, S.query) + '</div>' +
        '<div class="card-source">' +
          '<span>来源</span>' +
          (src.length ? src.map(function (s) {
            return '<span class="src-pill" data-act="goto" data-kind="frag" data-id="' + s.item.id + '">' + esc(firstLine(s.item.text, 20)) + '</span>';
          }).join('') : '<span style="color:var(--ink-4)">直接记录</span>') +
          (refs.length ? '<span style="margin-left:auto">用于 ' + refs.length + ' 篇文章</span>' : '') +
        '</div>' +
      '</div>';
    }).join('');
  }

  function renderArticlesPrimary() {
    var arts = DB.list('article');
    if (S.query) {
      var q = S.query.toLowerCase();
      arts = arts.filter(function (a) { return (a.title + ' ' + a.body).toLowerCase().indexOf(q) >= 0; });
    }
    if (!arts.length) { $('#primaryList').innerHTML = emptyHTML(); return; }
    $('#primaryList').innerHTML = arts.map(function (a) {
      var t = topicById(a.topicId);
      var body = (a.body || '').replace(/^#+\s*/gm, '');
      return '<div class="card-item" data-act="openArticle" data-id="' + a.id + '">' +
        '<button class="row-del" type="button" data-act="delArticle" data-id="' + a.id + '" aria-label="删除文章" title="删除文章">' +
        '<svg class="ico" viewBox="0 0 16 16"><path d="M3 4.5 H13 M6.5 4.5 V3.2 H9.5 V4.5 M5 4.5 L5.6 13 H10.4 L11 4.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
        '<div class="card-item-top">' +
          (t ? '<span class="card-badge" style="color:' + t.hue + ';background:' + hexA(t.hue, 0.12) + '">' + esc(t.name) + '</span>' : '<span class="card-badge">未归类</span>') +
          '<span style="margin-left:auto;font-size:11px;color:var(--ink-4)">' + when(a.updatedAt) + '</span>' +
        '</div>' +
        '<h3 class="card-title" style="font-size:16px">' + hl(a.title, S.query) + '</h3>' +
        '<div class="card-body" style="margin-top:8px;font-family:var(--serif)">' + hl(body, S.query) + '</div>' +
        '<div class="card-source"><span>素材 <b>' + (a.sourceIds || []).length + '</b> 条</span>' +
        '<span style="margin-left:auto">' + (a.body || '').replace(/\s/g, '').length + ' 字</span></div>' +
      '</div>';

  /* ===========================================================
     主渲染
     =========================================================== */
  function render() {
    renderCounts();
    renderPrimaryHead();
    if (S.view === 'cards') renderCardsPrimary();
    else if (S.view === 'articles') renderArticlesPrimary();
    else if (S.view === 'topics' && S.activeTopicId) renderTopicWorkbench();
    else renderFrags();
    renderSecondary();
    syncComposeButton();
    status(summaryLine(), syncLine());
  }

  function summaryLine() {
    var st = DB.stats();
    return st.frags + ' 条灵感 · ' + st.cards + ' 张卡片 · ' + st.topics + ' 个主题 · ' + st.articles + ' 篇文章';
  }

  /* ===========================================================
     记录面板：同一处写「灵感」或「知识卡片」
     =========================================================== */
  var COMPOSE_META = {
    frag: {
      label: '灵感', rows: 4, save: '保存灵感',
      placeholder: '写下此刻闪过的念头…（Ctrl + Enter 保存）',
      hint: '开始输入，自动推荐归属主题'
    },
    card: {
      label: '知识卡片', rows: 8, save: '保存卡片',
      placeholder: '把这条知识讲清楚：它是什么、为什么重要、怎么用…（Ctrl + Enter 保存）',
      hint: '留空标题会自动取自第一句'
    }
  };

  function openCompose(kind) {
    S.composeKind = kind === 'card' ? 'card' : 'frag';
    S.composeTopics = [];
    S.composeSim = [];
    S.composeSimDismissed = false;
    S.composeSuggested = '';
    $('#composeText').value = '';
    $('#composeTags').value = '';
    if ($('#composeTitle')) $('#composeTitle').value = '';
    $('#similarPanel').hidden = true;
    $('#similarPanel').innerHTML = '';
    applyComposeKind();
    renderComposeTopics();
    $('#composeMask').hidden = false;
    // 写卡片从标题开始，写灵感直接开口就写
    var first = S.composeKind === 'card' ? '#composeTitle' : '#composeText';
    setTimeout(function () { $(first).focus(); }, 60);
  }

  /* 切换记录类型时，把面板上所有该变的地方一次改到位 */
  function applyComposeKind() {
    var k = S.composeKind === 'card' ? 'card' : 'frag';
    var m = COMPOSE_META[k];
    $$('#composeKind .kind-btn').forEach(function (b) {
      var on = b.getAttribute('data-kind') === k;
      b.classList.toggle('is-on', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    var ti = $('#composeTitle');
    if (ti) ti.hidden = (k !== 'card');
    $('#composeText').setAttribute('rows', m.rows);
    $('#composeText').setAttribute('placeholder', m.placeholder);
    $('#composeSave').textContent = m.save;
    $('#composeSheet').setAttribute('aria-label', '记录' + m.label);
    if (!$('#composeText').value.trim()) $('#composeHint').textContent = m.hint;
  }

  /* 顶栏按钮跟着当前视图走：在卡片里就是「记卡片」，别处是「记灵感」 */
  function syncComposeButton() {
    var b = $('#btnCompose');
    var lab = $('#btnComposeLabel');
    if (!b || !lab) return;
    var isCard = S.view === 'cards';
    lab.textContent = isCard ? '记卡片' : '记灵感';
    b.title = isCard ? '记一张知识卡片（Ctrl + Shift + J）' : '记灵感（Ctrl + J）';
  }

  /* 把面板里的内容收成一次「待保存」的快照 */
  function composePayload() {
    var ti = $('#composeTitle');
    return {
      isCard: S.composeKind === 'card',
      title: ti ? ti.value.trim() : '',
      body: $('#composeText').value.trim(),
      tags: ($('#composeTags').value || '').split(/[,，、\s]+/).filter(Boolean)
    };
  }

  function renderComposeTopics() {
    var topics = DB.list('topic');
    var html = topics.map(function (t) {
      var on = S.composeTopics.indexOf(t.id) >= 0;
      return '<button class="chip' + (on ? ' is-on' : '') + '" type="button" data-act="toggleTopic" data-id="' + t.id + '"' +
        (on ? ' style="background:' + hexA(t.hue, 0.16) + ';color:' + t.hue + '"' : '') + '>' + esc(t.name) + '</button>';
    }).join('');
    html += '<button class="chip" type="button" data-act="newTopicInline">＋ 新主题</button>';
    $('#composeTopics').innerHTML = html;
  }

  function onComposeInput(debounce) {
    clearTimeout(S._compTimer);
    S._compTimer = setTimeout(function () { runComposeAnalysis(); }, debounce || 260);
  }

  function runComposeAnalysis() {
    var p = composePayload();
    var tags = p.tags;
    // 标题是强信号，一起送进分析
    var text = (p.title ? p.title + ' ' : '') + p.body;
    if (text.length < 4) {
      S.composeSuggested = '';
      $('#composeHint').textContent = p.isCard
        ? '写点什么，就会推荐归属主题'
        : '先留在收件箱；需要归入主题时点下面的标签';
      $('#similarPanel').hidden = true;
      return;
    }

    // 1) 归类建议（只提示，不代劳）
    var ranked = Engine.rankTopics(text, tags);
    var top = ranked.length ? ranked[0] : null;

    if (top && top.score >= 0.28) {
      var conf = Math.min(96, Math.round(top.score * 100));
      var others = ranked.slice(1, 3).filter(function (r) { return r.score > 0.14; });
      S.composeSuggested = top.topicId;
      var picked = S.composeTopics.indexOf(top.topicId) >= 0;
      if (picked) {
        $('#composeHint').textContent = '已归入「' + top.name + '」';
      } else {
        $('#composeHint').innerHTML = '建议归入 <b style="font-weight:500;color:var(--accent-deep)">' + esc(top.name) + '</b>（' + conf + '%）' +
          '<button class="btn btn-sm btn-ghost" data-act="applySuggest" type="button" style="margin-left:6px">采纳</button>' +
          (others.length ? '<span style="color:var(--ink-4)"> · 也可能属于 ' + esc(others.map(function (o) { return o.name; }).join('、')) + '</span>' : '') +
          '<span style="color:var(--ink-4)"> · 不点就留在收件箱</span>';
      }
    } else {
      $('#composeHint').textContent = '信号不足，先留在收件箱；需要时点下面的标签归入主题';
      S.composeSuggested = '';
    }
    renderComposeTopics();
    highlightSuggested();

    // 2) 相似提醒
    if (!S.composeSimDismissed) {
      var sims = Engine.findSimilar(text, {
        limit: 3, floor: 0.16, includeCards: true,
        tags: tags, topicIds: S.composeTopics
      });
      S.composeSim = sims;
      renderSimilar(sims, text);
    }
  }

  function highlightSuggested() {
    if (!S.composeSuggested) return;
    var btn = $('#composeTopics [data-id="' + S.composeSuggested + '"]');
    if (btn && !btn.classList.contains('is-on')) {
      btn.style.borderColor = 'var(--accent)';
      btn.style.color = 'var(--accent-deep)';
      btn.title = '推荐主题，点击选中';
    }
  }

  function renderSimilar(sims, text) {
    var panel = $('#similarPanel');
    if (!sims.length) { panel.hidden = true; return; }
    panel.hidden = false;
    panel.innerHTML = '<div class="sim-block">' +
      '<div class="sim-head">' +
        '<svg class="ico" viewBox="0 0 16 16"><path d="M8 1.5 L9.8 6.2 L14.5 8 L9.8 9.8 L8 14.5 L6.2 9.8 L1.5 8 L6.2 6.2 Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>' +
        '已有 ' + sims.length + ' 条内容与之相近 · 可以直接迭代' +
        '<button class="icon-btn" style="margin-left:auto;width:22px;height:22px" data-act="dismissSim" type="button" aria-label="忽略">' +
        '<svg class="ico" viewBox="0 0 16 16"><path d="M4 4 L12 12 M12 4 L4 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>' +
      '</div>' +
      sims.map(function (s) {
        var it = s.item;
        return '<div class="sim-item">' +
          '<span class="sim-item-text">' + esc(it.text || it.title) + '</span>' +
          '<span class="sim-score">' + Math.round(s.sim * 100) + '%</span>' +
          '<span class="sim-item-actions">' +
            '<button class="btn btn-sm btn-ghost" data-act="mergeInto" data-kind="' + s.kind + '" data-id="' + it.id + '">合并迭代</button>' +
            '<button class="btn btn-sm btn-ghost" data-act="viewSim" data-kind="' + s.kind + '" data-id="' + it.id + '">查看</button>' +
          '</span></div>';

  function saveCompose() {
    var p = composePayload();
    if (!p.body) { toast(p.isCard ? '先写点内容吧' : '先写点什么吧', 'warn'); return; }
    // 只采用你亲手选中的主题。程序的建议只做提示，不替你决定
    var topicIds = S.composeTopics.slice();
    S.composeSimDismissed = false;

    if (p.isCard) {
      DB.add('card', {
        title: p.title || firstLine(p.body, 26),
        body: p.body,
        tags: p.tags,
        topicIds: topicIds,
        sourceIds: []
      });
      closeSheet('#composeMask');
      S.view = 'cards';
      S.activeCardId = '';
      syncTabs();
      render();
      toast(topicIds.length
        ? '卡片已保存 · 已归入' + (topicIds.length === 1
            ? '「' + (topicById(topicIds[0]) || {}).name + '」'
            : ' ' + topicIds.length + ' 个主题')
        : '卡片已保存 · 可稍后归入主题', 'good');
      return;
    }

    DB.add('frag', {
      text: p.body, tags: p.tags, topicIds: topicIds,
      star: false, done: topicIds.length > 0
    });
    closeSheet('#composeMask');
    if (S.view === 'cards' || S.view === 'articles') S.view = 'inbox';
    syncTabs();
    render();
    if (topicIds.length) {
      toast(topicIds.length === 1
        ? '已归入「' + (topicById(topicIds[0]) || {}).name + '」'
        : '已归入 ' + topicIds.length + ' 个主题', 'good');
    } else if (S.composeSuggested) {
      var st = topicById(S.composeSuggested);
      toast('已存入收件箱' + (st ? ' · 已建议归入「' + st.name + '」' : ''), 'good');
    } else {
      toast('已存入收件箱', 'good');
    }
  }

  /* ===========================================================
     详情 / 编辑抽屉
     =========================================================== */
  function openEdit(kind, id) {
    S.editing = { kind: kind, id: id };
    var label = { frag: '编辑灵感', card: '知识卡片', article: '文章', topic: '主题' }[kind];
    $('#editLabel').textContent = label;
    $('#editBody').innerHTML = buildEditForm(kind, id);
    $('#editHint').textContent = kind === 'article' ? '正文支持 ## 小标题，直接写即可' : '';
    // 删除按钮只在编辑已有内容时出现（新建草稿不可删）
    $('#editDelete').hidden = !id;
    $('#editMask').hidden = false;
    if (kind === 'card') { renderEditSources(id); renderRelated(id); }
    if (kind === 'article') {
      renderEditSources(id); renderRelated(id);
      S._pickTopicId = '';
      renderArticlePicker(id);
    }
  }

  /* 卡片/文章详情里的「相近内容」提示 —— 与记录时的即时提醒呼应 */
  function renderRelated(id) {
    var box = $('#ed_related');

    var it = DB.get(S.editing.kind, id);

      '<svg class="ico" viewBox="0 0 16 16"><path d="M8 1.5 L9.8 6.2 L14.5 8 L9.8 9.8 L8 14.5 L6.2 9.8 L1.5 8 L6.2 6.2 Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>' +

      sims.map(function (s) {
        return '<div class="sim-item">' +
          '<span class="sim-item-text">' + esc(firstLine(s.item.text || s.item.title, 54)) + '</span>' +
          '<span class="sim-score">' + Math.round(s.display * 100) + '%</span>' +
          '<span class="sim-item-actions">' +

        '<div class="topic-pick" id="ed_topics">' +
          DB.list('topic').map(function (t) {
            var on = (it.topicIds || []).indexOf(t.id) >= 0;

        '<span class="field-note">一张卡片可以同时属于多个主题，跨领域的内容不必二选一。</span>' +

        '<div class="field"><label>来源灵感</label><div class="src-list" id="ed_sources"></div></div>' +
        '<div class="field" id="ed_related"></div>' +
        '<div class="field"><label for="ed_tags2">标签</label>' +

    if (kind === 'article') {
      return '<div class="field"><label for="ed_title">标题</label>' +

        '<div class="field"><label for="ed_body">正文</label>' +

          }).join('') + '</select></div>' +

        '<select id="ed_pickTopic"><option value="">选择主题…</option>' +
          DB.list('topic').map(function (t) {
            var n = DB.fragsOfTopic(t.id).length + DB.cardsOfTopic(t.id).length;
            return '<option value="' + t.id + '">' + esc(t.name) + '（' + n + '）</option>';
          }).join('') + '</select>' +

        '<div class="field"><label>引用素材</label><div class="src-list" id="ed_sources"></div></div>' +
        '<div class="field" id="ed_related"></div>' +
        '<div class="field" id="ed_picker"></div>';
    }

    if (kind === 'topic') {
      return '<div class="field"><label for="ed_name">名称</label>' +

        '<div class="field"><label for="ed_desc">一句话描述</label>' +

  function renderEditSources(id) {
    var host = $('#ed_sources');
    if (!host) return;
    var it = DB.get(S.editing.kind, id);
    var list = DB.sourcesOf(S.editing.kind, id);
    if (!list.length) {
      host.innerHTML = '<span class="field-note">还没有关联的来源。</span>';
      return;
    }
    host.innerHTML = list.map(function (s) {
      return '<div class="src-row"><span class="sr-text">' + esc(firstLine(s.item.text || s.item.title, 70)) + '</span>' +
        '<button class="icon-btn" data-act="unlink" data-sid="' + s.item.id + '" type="button" aria-label="移除">' +
        '<svg class="ico" viewBox="0 0 16 16"><path d="M4 4 L12 12 M12 4 L4 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button></div>';
    }).join('');
