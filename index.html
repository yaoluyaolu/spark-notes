<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>灵感笔记 · Spark</title>
<style>
/* ===========================================================
   灵感笔记 · 视觉系统
   纸感卡片 · 暖米色调 · 克制留白
   =========================================================== */

:root {
  --paper:        #FDFBF6;
  --paper-2:      #F8F4EA;
  --surface:      #FFFFFF;
  --surface-warm: #FFFDF8;
  --ink:          #322C23;
  --ink-2:        #6B6355;
  --ink-3:        #A2988A;
  --ink-4:        #C4BBAC;

  --line:         #EDE7DA;
  --line-soft:    #F2EDE3;
  --line-strong:  #DFD6C4;

  --accent:       #C0824E;
  --accent-soft:  #F3E4D3;
  --accent-deep:  #8E5E33;

  --sage:         #7E9179;
  --sage-soft:    #E8EDE3;

  --clay:         #B8735C;
  --clay-soft:    #F6E4DC;

  --gold:         #B08A3C;
  --gold-soft:    #F6ECD2;

  --radius-sm: 6px;
  --radius:    10px;
  --radius-lg: 14px;
  --radius-xl: 20px;

  --shadow-1: 0 1px 2px rgba(60, 48, 32, 0.045);
  --shadow-2: 0 2px 10px rgba(60, 48, 32, 0.06);

  --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", system-ui, -apple-system, sans-serif;
  --serif: "Songti SC", "Source Han Serif SC", Georgia, "Times New Roman", serif;

  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
}

* { box-sizing: border-box; }

/* hidden 属性必须强制生效 —— 否则会被 display:flex 等规则覆盖 */
[hidden] { display: none !important; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

::selection { background: var(--accent-soft); }

svg.ico {
  width: 14px; height: 14px;
  flex: 0 0 auto;
  display: block;
}

/* ---------- 布局 ---------- */

.app {
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  height: 100vh;
  height: 100dvh;
}

/* ---------- 顶栏 ---------- */

.topbar {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 14px 22px;
  border-bottom: 1px solid var(--line);
  background: var(--paper);
}

.brand { display: flex; align-items: center; gap: 9px; flex: 0 0 auto; }

.brand-mark {
  width: 20px; height: 20px;
  border-radius: 6px 6px 6px 2px;
  background: linear-gradient(145deg, #D9A26B, var(--accent));
  position: relative;
}
.brand-mark::after {
  content: "";
  position: absolute;
  inset: 5px 5px auto auto;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,0.75);
}

.brand-name {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.04em;
}

.topbar-search {
  flex: 1 1 auto;
  max-width: 480px;
  display: flex;
  align-items: center;
  gap: 9px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 7px 12px;
  color: var(--ink-3);
  transition: border-color 0.18s var(--ease), box-shadow 0.18s var(--ease);
}
.topbar-search:focus-within {
  border-color: var(--line-strong);
  box-shadow: 0 0 0 3px rgba(192,130,78,0.08);
}
.topbar-search input {
  flex: 1 1 auto;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font: inherit;
  min-width: 0;
}
.topbar-search input::placeholder { color: var(--ink-4); }
.topbar-search input::-webkit-search-cancel-button { -webkit-appearance: none; }

.hint-key {
  font-family: var(--sans);
  font-size: 11px;
  color: var(--ink-4);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 1px 5px;
  background: var(--paper-2);
}

.topbar-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }

/* ---------- 按钮 ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: inherit;
  font-size: 13px;
  border-radius: var(--radius-sm);
  padding: 7px 12px;
  cursor: pointer;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink-2);
  transition: background 0.16s var(--ease), color 0.16s var(--ease), border-color 0.16s var(--ease);
  white-space: nowrap;
}
.btn:hover { background: var(--paper-2); color: var(--ink); }
.btn:active { transform: translateY(0.5px); }

.btn-ghost { border-color: var(--line); }
.btn-ghost:hover { border-color: var(--line-strong); }

.btn-primary {
  background: var(--accent);
  color: #fff;
  font-weight: 500;
  padding: 7px 14px;
}
.btn-primary:hover { background: var(--accent-deep); color: #fff; }
.btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

.btn-danger { color: var(--clay); }
.btn-danger:hover { background: var(--clay-soft); color: var(--clay); }

/* 列表行的删除按钮：默认隐去，悬停卡片时浮现，不干扰阅读 */
.row-del {
  position: absolute;
  top: 8px; right: 8px;
  z-index: 2;
  width: 26px; height: 26px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--ink-4);
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.16s var(--ease), background 0.16s var(--ease), color 0.16s var(--ease);
}
.row-del .ico { display: block; }
.topic:hover .row-del,
.topic:focus-within .row-del,
.card-item:hover .row-del,
.card-item:focus-within .row-del,
.row-del:focus-visible { opacity: 1; }
.row-del:hover { background: var(--clay-soft); color: var(--clay); }

/* 触屏没有 hover，直接常显，否则无从发现 */
@media (hover: none) {
  .row-del { opacity: 0.75; }
}

.btn-sq { padding: 7px; }
.btn-sm { font-size: 12px; padding: 4px 9px; }

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px; height: 28px;
  border: 0;
  background: transparent;
  color: var(--ink-3);
  border-radius: var(--radius-sm);
  cursor: pointer;
}
.icon-btn:hover { background: var(--paper-2); color: var(--ink); }

/* ---------- 标签页 ---------- */

.tabs {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 22px;
  border-bottom: 1px solid var(--line);
  background: var(--paper);
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }

.tab {
  font: inherit;
  font-size: 13px;
  color: var(--ink-3);
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  padding: 11px 12px 9px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  transition: color 0.16s var(--ease), border-color 0.16s var(--ease);
}
.tab:hover { color: var(--ink-2); }
.tab.is-active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }

.tab-count {
  font-size: 11px;
  color: var(--ink-4);
  background: var(--paper-2);
  border-radius: 20px;
  padding: 0 6px;
  min-width: 18px;
  text-align: center;
}
.tab.is-active .tab-count { background: var(--accent-soft); color: var(--accent-deep); }

.tabs-tail {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  padding-left: 16px;
}

.chip {
  font: inherit;
  font-size: 12px;
  color: var(--ink-3);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 3px 10px;
  cursor: pointer;
  transition: all 0.16s var(--ease);
}
.chip:hover { color: var(--ink-2); border-color: var(--line-strong); }
.chip.is-on { background: var(--accent-soft); border-color: transparent; color: var(--accent-deep); }

.tabs-sep { width: 1px; height: 16px; background: var(--line); margin: 0 4px; }

select {
  font: inherit;
  font-size: 12px;
  color: var(--ink-2);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 4px 8px;
  outline: 0;
  cursor: pointer;
}

/* ---------- 工作区 ---------- */

.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
  gap: 0;
  overflow: hidden;
  min-height: 0;
}

.pane {
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
}
.pane-secondary { border-left: 1px solid var(--line); background: var(--paper-2); }

.pane-head {
  padding: 20px 22px 12px;
  flex: 0 0 auto;
}
.pane-title { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
.pane-sub { font-size: 12px; color: var(--ink-3); margin: 3px 0 0; }

.pane-body {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 0 22px 28px;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}
.pane-body::-webkit-scrollbar { width: 8px; }
.pane-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
.pane-body::-webkit-scrollbar-thumb:hover { background: var(--line-strong); }
.pane-body::-webkit-scrollbar-track { background: transparent; }

/* ---------- 灵感卡 ---------- */

.frag-group { margin-bottom: 22px; }

.group-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 8px;
  font-size: 12px;
  color: var(--ink-3);
  letter-spacing: 0.05em;
}
.group-head::after {
  content: "";
  flex: 1 1 auto;
  height: 1px;
  background: var(--line-soft);
}

.frag {
  position: relative;
  background: var(--surface-warm);
  border: 1px solid var(--line-soft);
  border-left: 3px solid var(--line-strong);
  border-radius: var(--radius);
  padding: 12px 14px 10px;
  margin-bottom: 9px;
  cursor: pointer;
  transition: border-color 0.18s var(--ease), box-shadow 0.18s var(--ease), transform 0.18s var(--ease);
}
.frag:hover {
  border-color: var(--line);
  border-left-color: var(--accent);
  box-shadow: var(--shadow-2);
  transform: translateY(-1px);
}
.frag.is-open {
  border-left-color: var(--accent);
  box-shadow: var(--shadow-2);
}
.frag.is-star { border-left-color: var(--gold); }
.frag.is-star::after {
  content: "";
  position: absolute;
  top: 11px; right: 12px;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--gold);
}

.frag-text {
  font-family: var(--serif);
  font-size: 14.5px;
  line-height: 1.72;
  color: var(--ink);
  white-space: pre-wrap;
  word-break: break-word;
}

.frag-foot {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 9px;
  font-size: 11.5px;
  color: var(--ink-4);
}

.frag-tag {
  color: var(--sage);
  background: var(--sage-soft);
  border-radius: 20px;
  padding: 1px 8px;
  font-size: 11px;
}
.frag-suggest {
  color: var(--accent-deep);
  background: var(--accent-soft);
  border-radius: 20px;
  padding: 1px 8px;
  font-size: 11px;
  cursor: pointer;
}
.frag-suggest:hover { background: #EBD9C2; }

.frag-time { margin-left: auto; white-space: nowrap; }

.frag-actions {
  display: none;
  gap: 4px;
  margin-top: 9px;
  padding-top: 9px;
  border-top: 1px dashed var(--line);
  flex-wrap: wrap;
}
.frag.is-open .frag-actions { display: flex; }

.frag-links {
  margin-top: 9px;
  padding-top: 9px;
  border-top: 1px dashed var(--line);
}
.frag-links-title {
  font-size: 11px;
  color: var(--ink-3);
  margin-bottom: 6px;
  letter-spacing: 0.04em;
}
.frag-link {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 12px;
  color: var(--ink-2);
  padding: 5px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  background: var(--paper-2);
  margin-bottom: 4px;
  transition: background 0.15s var(--ease);
}
.frag-link:hover { background: var(--accent-soft); }
.frag-link .lk-t { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frag-link .lk-s { color: var(--ink-4); font-size: 11px; }

/* ---------- 主题卡 ---------- */

.topic {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-lg);
  padding: 14px 15px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: border-color 0.18s var(--ease), box-shadow 0.18s var(--ease);
}
.topic:hover { border-color: var(--line-strong); box-shadow: var(--shadow-1); }
.topic.is-active { border-color: var(--accent); background: var(--surface-warm); }

.topic-row { display: flex; align-items: center; gap: 8px; }
.topic-name { font-size: 14px; font-weight: 500; flex: 1 1 auto; }
.topic-hue { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
.topic-desc { font-size: 12px; color: var(--ink-3); margin: 5px 0 0; line-height: 1.6; }

.topic-stats {
  display: flex;
  gap: 12px;
  margin-top: 10px;
  font-size: 11.5px;
  color: var(--ink-3);
}
.topic-stats b { font-weight: 500; color: var(--ink-2); }

.topic-meter {
  height: 3px;
  background: var(--paper-2);
  border-radius: 3px;
  margin-top: 10px;
  overflow: hidden;
}
.topic-meter i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }

.topic-keywords { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 9px; }
.kw {
  font-size: 11px;
  color: var(--ink-3);
  background: var(--paper-2);
  border-radius: 4px;
  padding: 1px 6px;
}

/* ---------- 卡片 ---------- */

.card-item {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-lg);
  padding: 15px 16px;
  margin-bottom: 11px;
  cursor: pointer;
  transition: border-color 0.18s var(--ease), box-shadow 0.18s var(--ease), transform 0.18s var(--ease);
}
.card-item:hover { border-color: var(--line-strong); box-shadow: var(--shadow-2); transform: translateY(-1px); }

.card-item-top { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.card-badge {
  font-size: 10.5px;
  letter-spacing: 0.06em;
  color: var(--accent-deep);
  background: var(--accent-soft);
  border-radius: 4px;
  padding: 1px 6px;
}
/* 一张卡片可挂多个主题徽章，横向排列 */
.badge-set { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.card-title { font-size: 14.5px; font-weight: 500; margin: 0; line-height: 1.5; }
.card-body {
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.75;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 5.6em;
  overflow: hidden;
  position: relative;
}
.card-body.is-full { max-height: none; }

.card-source {
  font-size: 11.5px;
  color: var(--ink-4);
  margin-top: 9px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.src-pill {
  background: var(--paper-2);
  border-radius: 20px;
  padding: 1px 8px;
  color: var(--ink-3);
}
.src-pill:hover { color: var(--accent-deep); }

/* ---------- 空态 ---------- */

.empty {
  text-align: center;
  padding: 46px 22px;
  color: var(--ink-3);
}
.empty-mark {
  width: 34px; height: 34px;
  margin: 0 auto 12px;
  border: 1.5px dashed var(--line-strong);
  border-radius: 8px 8px 8px 2px;
}
.empty-title { font-size: 13.5px; color: var(--ink-2); margin: 0 0 4px; }
.empty-sub { font-size: 12px; margin: 0; line-height: 1.7; }

/* ---------- 相似提示 ---------- */

.sim-block {
  border: 1px dashed var(--line-strong);
  background: var(--surface-warm);
  border-radius: var(--radius);
  padding: 11px 13px;
  margin-bottom: 14px;
}
.sim-head {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--accent-deep);
  margin-bottom: 8px;
}
.sim-head .ico { width: 12px; height: 12px; }

.sim-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 7px 9px;
  border-radius: var(--radius-sm);
  background: var(--surface);
  margin-bottom: 5px;
  border: 1px solid var(--line-soft);
}
.sim-item-text {
  flex: 1 1 auto;
  font-size: 12.5px;
  color: var(--ink-2);
  line-height: 1.6;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.sim-score {
  flex: 0 0 auto;
  font-size: 11px;
  color: var(--ink-4);
  font-variant-numeric: tabular-nums;
  padding-top: 2px;
}
.sim-item-actions { display: flex; gap: 5px; flex: 0 0 auto; }

/* ---------- 遮罩与抽屉 ---------- */

.sheet-mask {
  position: fixed;
  inset: 0;
  background: rgba(60, 48, 32, 0.24);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 60;
  animation: fade 0.16s var(--ease);
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.sheet {
  width: min(620px, 100%);
  max-height: calc(100vh - 48px);
  display: flex;
  flex-direction: column;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  box-shadow: 0 18px 50px rgba(60, 48, 32, 0.16);
  overflow: hidden;
  animation: rise 0.22s var(--ease);
}
.sheet-wide { width: min(780px, 100%); }

.sheet-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--line);
  flex: 0 0 auto;
}
.sheet-label { font-size: 12px; color: var(--ink-3); letter-spacing: 0.06em; }

/* 记录类型切换：同一处写灵感或知识卡片 */
.kind-switch {
  display: inline-flex;
  gap: 2px;
  padding: 2px;
  background: var(--paper-2);
  border: 1px solid var(--line);
  border-radius: 999px;
}
.kind-btn {
  border: 0;
  background: transparent;
  font: inherit;
  font-size: 12px;
  color: var(--ink-3);
  padding: 4px 14px;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.14s var(--ease), color 0.14s var(--ease);
}
.kind-btn:hover { color: var(--ink); }
.kind-btn.is-on {
  background: var(--paper);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(60, 48, 32, 0.09);
}
.kind-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.compose-title {
  border: 0;
  outline: 0;
  background: transparent;
  font-family: var(--serif);
  font-size: 17px;
  color: var(--ink);
  padding: 16px 20px 0;
  flex: 0 0 auto;
}
.compose-title::placeholder { color: var(--ink-4); font-family: var(--sans); font-size: 13.5px; }
/* 标题出现时，正文不必再留出那么大的上边距 */
.compose-title:not([hidden]) + .compose-input { padding-top: 8px; }

.compose-input {
  border: 0;
  outline: 0;
  resize: none;
  background: transparent;
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.78;
  color: var(--ink);
  padding: 18px 20px 8px;
  flex: 1 1 auto;
  min-height: 110px;
}
.compose-input::placeholder { color: var(--ink-4); font-family: var(--sans); font-size: 14px; }

.compose-meta {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 14px;
  padding: 0 20px 14px;
}
.meta-block { min-width: 0; }
.meta-label {
  display: block;
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}
.meta-block input[type="text"] {
  width: 100%;
  font: inherit;
  font-size: 13px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 6px 9px;
  outline: 0;
}
.meta-block input[type="text"]:focus { border-color: var(--line-strong); }

.topic-pick { display: flex; flex-wrap: wrap; gap: 5px; }

.similar-panel { padding: 0 20px 14px; }

.sheet-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 16px;
  border-top: 1px solid var(--line);
  background: var(--paper-2);
  flex: 0 0 auto;
}
.foot-hint { font-size: 11.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.foot-actions { display: flex; gap: 8px; flex: 0 0 auto; }

/* ---------- 编辑区 ---------- */

.edit-body {
  padding: 16px 20px 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label { font-size: 11px; color: var(--ink-3); letter-spacing: 0.05em; }
.field input[type="text"], .field textarea {
  font: inherit;
  font-size: 13.5px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  outline: 0;
  width: 100%;
  resize: vertical;
}
.field input[type="text"]:focus, .field textarea:focus { border-color: var(--line-strong); }
.field textarea { font-family: var(--serif); font-size: 14px; line-height: 1.75; }

.field-note { font-size: 11.5px; color: var(--ink-3); line-height: 1.6; }

.src-list { display: flex; flex-direction: column; gap: 5px; }
.src-row {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-sm);
  padding: 7px 10px;
  font-size: 12.5px;
}
.src-row .sr-text { flex: 1 1 auto; color: var(--ink-2); line-height: 1.55; }
.src-row .icon-btn { width: 24px; height: 24px; }

/* ===========================================================
   主题工作台 —— 主题是「被整理出来的桌子」，不是自动分拣的筐
   =========================================================== */

.wb-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 0 14px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--line-soft);
}
.wb-count { margin-left: auto; font-size: 12px; color: var(--ink-3); }

.wb-sec { margin-bottom: 22px; }
.wb-sec:last-child { margin-bottom: 0; }

.wb-sec-head {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--ink-3);
  margin-bottom: 9px;
}
.wb-sec-head b { font-weight: 500; color: var(--ink-2); font-size: 13px; }
.wb-sec-head .btn { margin-left: auto; }

.wb-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 9px 11px;
  margin-bottom: 5px;
  cursor: pointer;
  transition: border-color 0.14s ease, box-shadow 0.14s ease;
}
.wb-item:hover { border-color: var(--line-strong); box-shadow: var(--shadow-1); }

.wb-item-text {
  flex: 1 1 auto;
  font-size: 13px;
  line-height: 1.6;
  color: var(--ink-2);
}
.wb-item-text b { font-weight: 500; color: var(--ink); }

.wb-also {
  display: block;
  margin-top: 3px;
  font-size: 11px;
  font-weight: 400;
  color: var(--ink-4);
}

.wb-unlink {
  width: 24px;
  height: 24px;
  flex: 0 0 auto;
  opacity: 0;
  color: var(--ink-4);
  transition: opacity 0.14s ease, background 0.14s ease, color 0.14s ease;
}
.wb-item:hover .wb-unlink,
.wb-item:focus-within .wb-unlink { opacity: 1; }
.wb-unlink:hover { background: var(--clay-soft); color: var(--clay); }
.wb-unlink:focus-visible { opacity: 1; }

.wb-empty {
  font-size: 12.5px;
  color: var(--ink-4);
  margin: 2px 0 0;
}

@media (hover: none) {
  .wb-unlink { opacity: 0.7; }
}

/* ---------- 收纳面板 ---------- */

.collect-body {
  padding: 4px 20px 8px;
  max-height: min(58vh, 520px);
  overflow-y: auto;
}

.collect-head {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  padding: 8px 0 10px;
}
.collect-head .collect-sub {
  display: block;
  margin-top: 4px;
  font-size: 11.5px;
  font-weight: 400;
  color: var(--ink-3);
}

.collect-tabs {
  display: flex;
  gap: 6px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line-soft);
  margin-bottom: 4px;
}

.collect-group {
  font-size: 11.5px;
  letter-spacing: 0.05em;
  color: var(--ink-4);
  margin: 14px 0 7px;
}

.collect-row {
  display: flex;
  align-items: center;
  gap: 9px;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-sm);
  padding: 8px 11px;
  margin-bottom: 5px;
  cursor: pointer;
  transition: border-color 0.14s ease, background 0.14s ease;
}
.collect-row:hover { border-color: var(--line-strong); }
.collect-row.is-in { background: var(--surface-warm); border-color: var(--accent-soft); }

.collect-row input[type="checkbox"] {
  flex: 0 0 auto;
  width: 15px;
  height: 15px;
  accent-color: var(--accent);
  cursor: pointer;
}

.collect-text {
  flex: 1 1 auto;
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--ink-2);
}
.collect-text b { font-weight: 500; color: var(--ink); }

.collect-hint {
  display: block;
  margin-top: 2px;
  font-size: 11px;
  color: var(--ink-4);
}

.collect-tag {
  flex: 0 0 auto;
  font-size: 10.5px;
  color: var(--accent-deep);
  background: var(--accent-soft);
  border-radius: 3px;
  padding: 2px 6px;
}

@media (max-width: 620px) {
  .collect-body { padding: 4px 14px 8px; }
}


/* ---------- 数据面板 ---------- */

.data-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  padding: 16px 20px 6px;
}
.stat {
  background: var(--paper-2);
  border-radius: var(--radius);
  padding: 12px;
  text-align: center;
}
.stat b { display: block; font-size: 21px; font-weight: 600; color: var(--accent-deep); }
.stat span { font-size: 11px; color: var(--ink-3); }

.data-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 14px 20px 6px;
}
.data-note {
  font-size: 11.5px;
  color: var(--ink-3);
  line-height: 1.65;
  padding: 0 20px 18px;
  margin: 0;
}

/* ---------- 关系视图 ---------- */

.graph-layer {
  position: fixed;
  inset: 0;
  background: var(--paper);
  z-index: 70;
  display: flex;
  flex-direction: column;
  animation: fade 0.18s var(--ease);
}
.graph-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 20px 24px 14px;
  border-bottom: 1px solid var(--line);
  flex: 0 0 auto;
}
.graph-stage {
  flex: 1 1 auto;
  position: relative;
  overflow: hidden;
  min-height: 0;
}
#graphSvg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.graph-legend {
  position: absolute;
  bottom: 18px; left: 24px;
  display: flex;
  gap: 16px;
  font-size: 11.5px;
  color: var(--ink-3);
  background: rgba(253, 251, 246, 0.9);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 7px 12px;
}
.graph-legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot-frag { background: var(--accent); }
.dot-card { background: var(--sage); border-radius: 2px; }
.dot-topic { background: var(--clay); }

.gnode { cursor: pointer; }
.gnode circle, .gnode rect { transition: opacity 0.16s var(--ease); }
.gnode:hover .gn-label { font-weight: 600; }
.gn-label { font-size: 11px; fill: var(--ink-2); pointer-events: none; }
.gn-label-strong { font-size: 12px; fill: var(--ink); font-weight: 600; pointer-events: none; }

/* ---------- 状态栏与提示 ---------- */

.statusbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 22px;
  border-top: 1px solid var(--line);
  font-size: 11.5px;
  color: var(--ink-3);
  background: var(--paper);
}
.status-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--ink-4); }
.mini-key {
  font-family: var(--sans);
  font-size: 10.5px;
  color: var(--ink-3);
  background: var(--paper-2);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0 5px;
}
.key-label { margin-left: -5px; color: var(--ink-4); }
#statusRight { margin-left: auto; color: var(--ink-4); }

.toasts {
  position: fixed;
  bottom: 46px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  z-index: 90;
  pointer-events: none;
}
.toast {
  background: var(--ink);
  color: #FBF8F1;
  font-size: 12.5px;
  border-radius: var(--radius);
  padding: 9px 16px;
  box-shadow: 0 6px 20px rgba(60, 48, 32, 0.2);
  animation: rise 0.2s var(--ease);
  max-width: 420px;
  text-align: center;
}
.toast.is-warn { background: var(--clay); }
.toast.is-good { background: var(--sage); }

/* ---------- 响应式 ---------- */

@media (max-width: 980px) {
  .workspace { grid-template-columns: minmax(0, 1fr); }
  .pane-secondary { display: none; }
  .workspace.show-secondary .pane-secondary {
    display: flex;
    position: fixed;
    inset: 0;
    z-index: 50;
    border-left: 0;
  }
  .topbar { flex-wrap: wrap; gap: 10px; padding: 12px 16px; }
  .topbar-search { order: 3; max-width: none; flex-basis: 100%; }
  .hint-key { display: none; }
  .tabs-tail { padding-left: 8px; }
  .compose-meta { grid-template-columns: 1fr; }
  .data-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pane-head { padding: 16px 16px 10px; }
  .pane-body { padding: 0 16px 24px; }
}

@media (max-width: 560px) {
  .btn span { display: none; }
  .btn-primary span { display: inline; }
  .pane-title { font-size: 14px; }
}

/* ---------- 多设备同步 ---------- */

#btnSync.is-on { color: var(--sage); background: var(--sage-soft); }
#btnSync.is-err { color: var(--clay); background: var(--clay-soft); }

.btn:disabled { opacity: 0.45; cursor: default; }

.sync-body {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 14px 20px 4px;
  overflow-y: auto;
}

.sync-lead {
  margin: 0;
  font-size: 12px;
  line-height: 1.72;
  color: var(--ink-2);
  background: var(--paper-2);
  border-radius: var(--radius);
  padding: 11px 13px;
}
.sync-lead b { color: var(--accent-deep); font-weight: 600; }

.sync-field { display: flex; flex-direction: column; gap: 5px; }
.sync-field > label { font-size: 11.5px; color: var(--ink-3); letter-spacing: 0.02em; }
.sync-field > input {
  font: inherit;
  font-size: 12.5px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  outline: none;
}
.sync-field > input:focus { border-color: var(--accent); }

.sync-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.sync-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  color: var(--ink-2);
  cursor: pointer;
}

.sync-actions { display: flex; flex-wrap: wrap; gap: 8px; }

.sync-line {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 12px;
  color: var(--ink-2);
  background: var(--paper-2);
  border-radius: var(--radius);
  padding: 10px 13px;
  line-height: 1.6;
}
.sync-tag {
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--line-soft);
  color: var(--ink-3);
  white-space: nowrap;
}
.sync-tag.is-ok { background: var(--sage-soft); color: var(--sage); }
.sync-tag.is-busy { background: var(--gold-soft); color: var(--gold); }
.sync-tag.is-err { background: var(--clay-soft); color: var(--clay); }

.sync-fp {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--accent-deep);
}

/* 口令不一致的告警。必须显眼 —— 它决定「内容看不看得见」，
   缩成一行小字等于没提示。 */
.sync-warn {
  padding: 10px 12px;
  font-size: 12px;
  line-height: 1.75;
  color: var(--ink);
  background: var(--clay-soft);
  border: 1px solid #E6C6B6;
  border-radius: var(--radius);
}
.sync-warn b { color: var(--clay); font-weight: 600; }
.sync-inline-btn {
  margin-left: 6px;
  padding: 1px 9px;
  font: inherit;
  font-size: 11.5px;
  color: var(--ink-2);
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  cursor: pointer;
}
.sync-inline-btn:hover { color: var(--clay); border-color: #E6C6B6; }

.sync-link {
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--paper-2);
  border-radius: var(--radius);
  padding: 12px 13px;
}
.sync-link > .sync-field > input { font-size: 11.5px; }
.sync-tip {
  margin: 0;
  font-size: 11.5px;
  line-height: 1.65;
  color: var(--ink-3);
}
.sync-tip b { color: var(--ink-2); font-weight: 600; }

.sync-more { font-size: 12px; color: var(--ink-3); }
.sync-more > summary { cursor: pointer; padding: 5px 0; }
.sync-sql {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  line-height: 1.62;
  white-space: pre-wrap;
  word-break: break-word;
  background: var(--paper-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  margin: 4px 0 0;
  color: var(--ink-2);
}

@media (max-width: 620px) {
  .sync-two { grid-template-columns: 1fr; }
}

</style>
</head>
<body>

<div class="app" id="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">灵感笔记</span>
    </div>

    <div class="topbar-search">
      <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.4 10.4 L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input id="globalSearch" type="search" placeholder="搜索灵感、卡片、主题、文章…" autocomplete="off" spellcheck="false">
      <kbd class="hint-key">Ctrl K</kbd>
    </div>

    <div class="topbar-actions">
      <button class="btn btn-ghost" id="btnGraph" type="button" title="关系视图">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="12.5" cy="3.8" r="2" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="12.5" cy="12.2" r="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5.3 7.2 L10.8 4.4 M5.3 8.8 L10.8 11.6" stroke="currentColor" stroke-width="1.2"/></svg>
        <span>关系</span>
      </button>
      <button class="btn btn-ghost" id="btnData" type="button" title="数据">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><ellipse cx="8" cy="4" rx="4.6" ry="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3.4 4 V12 C3.4 13.1 5.5 14 8 14 C10.5 14 12.6 13.1 12.6 12 V4" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3.4 8 C3.4 9.1 5.5 10 8 10 C10.5 10 12.6 9.1 12.6 8" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        <span>数据</span>
      </button>
      <button class="btn btn-ghost" id="btnSync" type="button" title="多设备同步">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6.4 A5 5 0 0 1 12.4 5.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M12.6 3 V5.6 H10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 9.6 A5 5 0 0 1 3.6 10.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M3.4 13 V10.4 H6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="btnSyncLabel">同步</span>
      </button>
      <button class="btn btn-primary" id="btnCompose" type="button" title="记灵感（Ctrl + J）">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.2 V12.8 M3.2 8 H12.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span id="btnComposeLabel">记灵感</span>
      </button>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab is-active" data-view="inbox" role="tab">收件箱 <span class="tab-count" data-count="loose"></span></button>
    <button class="tab" data-view="cards" role="tab">知识卡片 <span class="tab-count" data-count="cards"></span></button>
    <button class="tab" data-view="topics" role="tab">主题 <span class="tab-count" data-count="topics"></span></button>
    <button class="tab" data-view="articles" role="tab">文章 <span class="tab-count" data-count="articles"></span></button>
    <div class="tabs-tail">
      <button class="chip is-on" data-filter="all" type="button">全部</button>
      <button class="chip" data-filter="recent" type="button">近 7 天</button>
      <button class="chip" data-filter="star" type="button">星标</button>
      <button class="chip" data-filter="sim" type="button">待迭代</button>
      <span class="tabs-sep" aria-hidden="true"></span>
      <select id="sortBy" title="排序">
        <option value="new">最新优先</option>
        <option value="old">最早优先</option>
        <option value="sim">相似度</option>
      </select>
      <button class="btn btn-ghost btn-sq" id="toggleRel" type="button" title="显示关联提示"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 9.5 A3 3 0 0 0 11 9.5 L13 7.5 A3 3 0 0 0 8.5 3 L7.5 4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M9.5 6.5 A3 3 0 0 0 5 6.5 L3 8.5 A3 3 0 0 0 7.5 13 L8.5 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
    </div>
  </nav>

  <main class="workspace">

    <section class="pane pane-primary">
      <div class="pane-head">
        <h2 class="pane-title" id="primaryTitle">收件箱</h2>
        <p class="pane-sub" id="primarySub">未归类的灵感会留在这里，随时可以聚合</p>
      </div>
      <div class="pane-body" id="primaryList"></div>
    </section>

    <section class="pane pane-secondary">
      <div class="pane-head">
        <h2 class="pane-title" id="secondaryTitle">主题脉络</h2>
        <p class="pane-sub" id="secondarySub">灵感按主题自动聚拢</p>
      </div>
      <div class="pane-body" id="secondaryList"></div>
    </section>

  </main>

  <footer class="statusbar">
    <span id="statusLeft">准备就绪</span>
    <span class="status-dot" aria-hidden="true"></span>
    <kbd class="mini-key">Ctrl J</kbd><span class="key-label">记灵感</span>
    <kbd class="mini-key">Ctrl K</kbd><span class="key-label">搜索</span>
    <span id="statusRight">本地保存 · 自动</span>
  </footer>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="sheet-mask" id="composeMask" hidden>
  <div class="sheet" id="composeSheet" role="dialog" aria-modal="true" aria-label="记录灵感">
    <div class="sheet-top">
      <div class="kind-switch" id="composeKind" role="tablist" aria-label="记录类型">
        <button class="kind-btn is-on" data-kind="frag" type="button" role="tab" aria-selected="true" title="随手记下的念头（Ctrl + J）">灵感</button>
        <button class="kind-btn" data-kind="card" type="button" role="tab" aria-selected="false" title="写成一条结构化知识（Ctrl + Shift + J）">知识卡片</button>
      </div>

<script>
/* ===========================================================
   灵感笔记 · 数据层（纯本地）
   =========================================================== */
(function (global) {
  'use strict';

  var KEY = 'spark-notes/v1';
  var DEVKEY = 'spark-notes/device';

  /* 本机标识。用途有二：给本机发出的 ID 打来源前缀、记录每条内容最后是谁改的。
     故意存在独立的键里 —— 不随数据一起导出、导入或重置，因为换台设备时
     不该沿用旧身份（否则两台机器会被当成同一台，改动来源就分不清了）。 */
  var devId = null;
  function deviceId() {
    if (devId) return devId;
    try {
      var got = global.localStorage.getItem(DEVKEY);
      if (got) { devId = got; return devId; }
    } catch (e) { /* 忽略损坏数据 */ }
    devId = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    try { global.localStorage.setItem(DEVKEY, devId); } catch (e) { /* 忽略写入失败 */ }
    return devId;
  }

  /* 记录 ID 里嵌一段设备标记。原来的「时间戳 + 5 位随机数」在本机够用，
     但两台设备在同一毫秒各生成一条时，有小概率撞到同一个 ID ——
     撞上之后同步会把两条不同的内容当成同一条，互相覆盖。 */
  var uid = function (p) {
    return (p || 'x') + '_' + deviceId().slice(-4) +
      Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  };

  function blank() {
    return { version: 1, topics: [], cards: [], articles: [], frags: [] };
  }

  /* ---------- 版本戳 ----------
     每次内容落库都盖一次戳，供日后同步判断「谁后改」：
       updatedAt  —— 时间
       deviceId   —— 最后改它的那台设备
       rev        —— 这台设备上改了几次
     三个字段都是明文的。这一点很关键：内容字段将来加密上云后，
     冲突裁决只看这三个字段，服务端拿着密文也能正确合并，不必解密。 */
  function stamp(item, isNew) {
    item.updatedAt = Date.now();
    item.deviceId = deviceId();
    item.rev = (isNew ? 0 : (+item.rev || 0)) + 1;
    return item;
  }

  /* 比较两个版本，返回 -1（a 更旧）/ 0（同一版本）/ 1（a 更新）。
     规则定死为「时间大者胜，时间相同比设备标识」，两端用同一套规则算，
     结果必然一致 —— 不会出现两台设备各自认为自己该赢的死循环。 */
  function compareVersion(a, b) {
    var ta = +(a && a.updatedAt) || 0, tb = +(b && b.updatedAt) || 0;
    if (ta !== tb) return ta > tb ? 1 : -1;
    var da = String((a && a.deviceId) || ''), db2 = String((b && b.deviceId) || '');
    if (da !== db2) return da > db2 ? 1 : -1;
    var ra = +(a && a.rev) || 0, rb = +(b && b.rev) || 0;
    if (ra !== rb) return ra > rb ? 1 : -1;
    return 0;
  }

  /* ---------- 示例种子数据 ---------- */
  function seed() {
    var t1 = { id: 'tp_write', name: '写作方法', desc: '关于如何写、为什么写、写不下去时怎么办', hue: '#C0824E',
      keywords: ['写作', '表达', '语言', '句子', '修改', '文体', '读者', '叙述', '修辞', '比喻', '落笔', '稿'] };
    var t2 = { id: 'tp_cog', name: '认知科学', desc: '注意力、记忆、判断与决策', hue: '#7E9179',
      keywords: ['注意力', '认知', '记忆', '判断', '决策', '偏差', '大脑', '思考', '学习', '长期主义', '反馈', '习惯', '拖延', '模糊'] };
    var t3 = { id: 'tp_prod', name: '产品与设计', desc: '做东西时的取舍与直觉', hue: '#B8735C',
      keywords: ['产品', '设计', '用户', '界面', '体验', '交互', '功能', '需求', '细节', '按钮', '点击'] };
    var t4 = { id: 'tp_life', name: '生活观察', desc: '日常里被记住的瞬间', hue: '#B08A3C',
      keywords: ['生活', '日常', '时间', '习惯', '关系', '城市', '旅行', '情绪', '清晨', '阳光'] };
    var now = Date.now();
    var D = 86400000;

    var topics = [t1, t2, t3, t4];

    var frags = [
      mk('f1', '写作不是把想法说出来，而是把想法逼出来。落笔之前我以为自己懂了，落笔之后才发现只懂了一半。', ['tp_write'], ['写作'], now - 2 * 3600e3, true),
      mk('f2', '注意力是最稀缺的资产，比时间更不可逆。时间可以被填满，注意力被切碎之后就拼不回来了。', [], ['注意力'], now - 5 * 3600e3, false),
      mk('f3', '好的比喻是认知的捷径。它不解释，它直接让你看见。', ['tp_cog'], ['比喻', '认知'], now - 26 * 3600e3, true),
      mk('f4', '专注力的稀缺性可能被严重低估了：能连续想一件事四十分钟，在今天已经是一种特权。', [], [], now - 30 * 3600e3, false),
      mk('f5', '界面里最好的那部分是没有界面的那部分——用户没意识到自己经过了它。', ['tp_prod'], ['设计'], now - 2 * D, false),
      mk('f6', '修改不是把句子改漂亮，是把不属于它的部分摘掉。', ['tp_write'], ['修改'], now - 3 * D, false),
      mk('f7', '记笔记真正的成本不是写，是以后找不到。所以结构比勤奋重要。', ['tp_cog'], ['笔记'], now - 4 * D, false),
      mk('f8', '城市里最好的一小时是清晨六点半，那时候街上所有人都在做自己的事，没有人表演。', ['tp_life'], ['城市'], now - 6 * D, false)
    ];

    var cards = [
      {
        id: 'cd_1', title: '写作是一种思考方式，而不是思考的记录',
        body: '我们常把写作理解为「把想清楚的东西写下来」。但真实的顺序往往相反：写下来，才想清楚。\n\n原因在于，脑内的想法是并行的、模糊的、可以随时修改的；而语言是线性的、离散的、必须选择下一个词。这个强制选择的过程，会把原本混在一起的判断拆开，暴露出你其实没有想明白的地方。\n\n所以卡住不是写作的故障，卡住是写作在起作用。',
        topicIds: ['tp_write'], sourceIds: ['f1', 'f6'], tags: ['写作', '思考'],
        createdAt: now - 3 * D, updatedAt: now - 2 * D
      },
      {
        id: 'cd_2', title: '注意力是比时间更硬的约束',
        body: '时间可以被延长感受（等待、无聊），但注意力一旦被切碎，恢复成本极高。\n\n推论：\n一、日程表应该按「注意力块」而不是「小时」安排；\n二、被打断的代价不是打断本身的长度，而是重新进入状态的时间；\n三、保护注意力比管理时间更有效。',
        topicIds: ['tp_cog', 'tp_life'], sourceIds: ['f2', 'f4'], tags: ['注意力', '专注'],
        createdAt: now - 20 * 3600e3, updatedAt: now - 6 * 3600e3
      }
    ];

    var articles = [
      {
        id: 'ar_1', title: '写作是思考的显影液',
        body: '## 一、我们误会了写作的顺序\n\n关于写作，最常见的想象是：先想清楚，再写下来。写作被视为一个「输出」环节。\n\n但真实经验几乎总是相反的。\n\n## 二、语言为什么能逼出想法\n\n脑海中的念头是并行的、模糊的。而句子必须一个词一个词地排列出来。\n\n## 三、卡住是好事\n\n很多人把写不下去当成才思枯竭的证据。',
        topicId: 'tp_write', sourceIds: ['cd_1', 'f1', 'f6'], tags: ['写作'],
        createdAt: now - 2 * D, updatedAt: now - 26 * 3600e3
      }
    ];

    var data = { version: 1, topics: topics, cards: cards, articles: articles, frags: frags };

    /* 打上「出厂示例」标记。
       这几条的 ID 是写死的，所以两台设备第一次打开时生成的是同一条，
       同步后会合成一份而不是变成两份 —— 这是好的一面。
       麻烦也在同一个地方：在一台设备上把它删掉之后，
       另一台新设备又生成一份出来，而且时间戳比墓碑更新，
       就会把「已删除」这件事盖回去。后果是删了又自己长回来。
       同步层靠这个标记挡住它，见 sync.js 的 reconcile。 */
    ['topics', 'cards', 'articles', 'frags'].forEach(function (k) {
      data[k].forEach(function (it) { it.demo = 1; });
    });
    return data;

    function mk(id, text, topicIds, tags, ts, star) {
      return { id: id, text: text, topicIds: topicIds || [], tags: tags || [],
        createdAt: ts, updatedAt: ts, star: !!star, done: (topicIds && topicIds.length) > 0 };
    }
  }

  /* ---------- 读写 ---------- */
  var db = null;        // 完整数据，含已删除项的墓碑
  var viewCache = null; // 对外的活数据视图

  function alive(it) { return !!it && !it.deletedAt; }

  /* 完整数据：只有本模块内部和将来的同步层该用它。
     上层调用者一律走 load()，看不到墓碑。 */
  function raw() {
    if (db) return db;
    try {
      var stored = global.localStorage.getItem(KEY);
      if (stored) {
        db = normalize(JSON.parse(stored));
        return db;
      }
    } catch (e) { /* 忽略损坏数据 */ }
    db = normalize(seed());
    save();
    return db;
  }

  /* 对外视图：墓碑已被摘掉。
     这样列表、搜索、统计、关系图、导出、主题工作台全都不必知道
     「删除」在底层其实是打标记而不是抹掉 —— 一个地方改，处处免疫。 */
  function load() {
    var d = raw();
    if (!viewCache) {
      viewCache = {
        version: d.version,
        topics: d.topics.filter(alive),
        cards: d.cards.filter(alive),
        articles: d.articles.filter(alive),
        frags: d.frags.filter(alive)
      };
    }
    return viewCache;
  }

  function normalize(d) {
    var out = blank();
    if (!d || typeof d !== 'object') return out;
    out.version = d.version || 1;
    ['topics', 'cards', 'articles', 'frags'].forEach(function (k) {
      var arr = Array.isArray(d[k]) ? d[k] : [];
      out[k] = arr.filter(function (it) { return it && typeof it === 'object'; });
    });
    out.frags.forEach(function (f) {
      f.topicIds = Array.isArray(f.topicIds) ? f.topicIds : [];
      f.tags = Array.isArray(f.tags) ? f.tags : [];
      f.star = !!f.star;
      f.createdAt = +f.createdAt || Date.now();
      f.updatedAt = +f.updatedAt || f.createdAt;
    });
    out.cards.forEach(function (c) {
      c.sourceIds = Array.isArray(c.sourceIds) ? c.sourceIds : [];
      c.tags = Array.isArray(c.tags) ? c.tags : [];
      // 迁移：早期版本卡片只有单值 topicId，现在改为 topicIds 数组（可跨主题）
      if (Array.isArray(c.topicIds)) {
        c.topicIds = c.topicIds.filter(function (x) { return typeof x === 'string' && x; });
      } else if (c.topicId) {
        c.topicIds = [c.topicId];
      } else {
        c.topicIds = [];
      }
      delete c.topicId;
      c.createdAt = +c.createdAt || Date.now();
      c.updatedAt = +c.updatedAt || c.createdAt;
    });
    out.articles.forEach(function (a) {
      a.sourceIds = Array.isArray(a.sourceIds) ? a.sourceIds : [];
      a.tags = Array.isArray(a.tags) ? a.tags : [];
      a.createdAt = +a.createdAt || Date.now();
      a.updatedAt = +a.updatedAt || a.createdAt;
    });
    out.topics.forEach(function (t) {
      t.keywords = Array.isArray(t.keywords) ? t.keywords : [];
      if (!t.hue) t.hue = '#C0824E';
    });
    /* 同步所需的元数据。老数据里没有这几个字段，在这里补齐 ——
       缺了它们，两台设备之间就无法判断一条内容该以谁为准。 */
    ['topics', 'cards', 'articles', 'frags'].forEach(function (k) {
      out[k].forEach(function (it) {
        it.deletedAt = +it.deletedAt || 0;   // 墓碑：大于 0 表示这条已被删除
        it.rev = +it.rev || 1;
        it.deviceId = it.deviceId || '';
        it.createdAt = +it.createdAt || Date.now();
        it.updatedAt = +it.updatedAt || it.createdAt;
      });
    });
    /* 已彻底清理掉的记录名单。墓碑清干净之后，还得记住「它真的没了」，
       否则下一轮同步会把远端残留的墓碑当成新消息重新采纳。 */
    out.graves = (Array.isArray(d.graves) ? d.graves : [])
      .filter(function (g) { return g && typeof g.doc === 'string' && g.doc; })
      .map(function (g) { return { doc: g.doc, at: +g.at || 0 }; });
    return out;
  }

  var saveTimer = null;
  function save(immediate) {
    if (!db) return;
    viewCache = null;   // 任何一次落库都让视图失效，下次读时重建
    var write = function () {
      try {
        global.localStorage.setItem(KEY, JSON.stringify(db));
      } catch (e) {
        if (global.Spark && global.Spark.toast) {
          global.Spark.toast('本地存储写入失败，可能空间已满', 'warn');
        }
      }
      /* 通知同步层：本地有新改动，稍后推上去。
         放在真正落库这一刻而不是 save() 开头，是为了让防抖生效 ——
         连续敲字只会攒成一次推送，而不是一个字一个请求。 */
      if (global.Sync && global.Sync.onLocalChange) {
        try { global.Sync.onLocalChange(); } catch (e2) { /* 同步层出错不该影响本地保存 */ }
      }
    };
    if (immediate) { clearTimeout(saveTimer); saveTimer = null; write(); return; }
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { saveTimer = null; write(); }, 220);
  }

  function reset(withSeed) {
    db = normalize(withSeed === false ? blank() : seed());
    save(true);
    return db;
  }

  function replaceAll(obj) {
    db = normalize(obj);
    save(true);
    return db;
  }

  /* ---------- 通用 CRUD ---------- */
  var COLL = { frag: 'frags', card: 'cards', topic: 'topics', article: 'articles' };
  var KIND_OF = { frags: 'frag', cards: 'card', topics: 'topic', articles: 'article' };
  var KINDS = ['frag', 'card', 'topic', 'article'];

  function list(kind) {
    var d = load();
    var k = COLL[kind];
    if (!k) return [];
    return d[k].slice().sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
  }

  function get(kind, id) {
    var d = load();
    var k = COLL[kind];
    if (!k) return null;
    for (var i = 0; i < d[k].length; i++) if (d[k][i].id === id) return d[k][i];
    return null;
  }

  function add(kind, obj) {
    var d = raw();
    var k = COLL[kind];
    if (!k) return null;
    var item = Object.assign({}, obj);
    item.id = item.id || uid(kind.slice(0, 2));
    item.createdAt = +item.createdAt || Date.now();
    item.deletedAt = 0;
    item.rev = 0;

    return item;

  function update(kind, id, patch) {

    save();
    return item;

     真删掉的那条没法告诉另一台设备「它没了」，对方下次同步还会把它推回来 ——

        if (it.deletedAt) return;
        if (!Array.isArray(it[field])) return;
        var i = it[field].indexOf(val);
        if (i < 0) return;
        it[field].splice(i, 1);

      });

      dropRef(d.articles, 'sourceIds', id);

    }
    if (kind === 'topic') {
      dropRef(d.frags, 'topicIds', id);
      dropRef(d.cards, 'topicIds', id);

    var out = [];
    if (kind === 'card') {

      if (c) c.sourceIds.forEach(function (sid) {
        var f = get('frag', sid);
        if (f) out.push({ kind: 'frag', item: f });

    } else if (kind === 'article') {
      var a = get('article', id);
      if (a) a.sourceIds.forEach(function (sid) {

    if (!topicId) return [];
    return d.frags.filter(function (f) { return (f.topicIds || []).indexOf(topicId) >= 0; })
      .sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
  }

  function cardsOfTopic(topicId) {
    var d = load();
    if (!topicId) return [];
    return d.cards.filter(function (c) { return (c.topicIds || []).indexOf(topicId) >= 0; })
      .sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
  }

  function articlesOfTopic(topicId) {
    var d = load();
    if (!topicId) return [];
    return d.articles.filter(function (a) { return a.topicId === topicId; })
      .sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
  }

  /* 一张卡片所属的全部主题对象（可能为空数组） */
  function topicsOfCard(cardId) {
    var c = get('card', cardId);
    if (!c) return [];
    return (c.topicIds || []).map(function (id) { return get('topic', id); }).filter(Boolean);

      topic: get('topic', topicId),
      frags: fragsOfTopic(topicId),
      cards: cardsOfTopic(topicId),
      articles: articlesOfTopic(topicId)

  function addToTopic(topicId, items) {
    if (!get('topic', topicId)) return 0;
    var d = load();
    var n = 0;
    (items || []).forEach(function (it) {
      var kind = it && it.kind, id = it && it.id;
      if (kind !== 'frag' && kind !== 'card') return;
      var obj = get(kind, id);
      if (!obj) return;
      var list = obj.topicIds || (obj.topicIds = []);
      if (list.indexOf(topicId) < 0) { list.push(topicId); stamp(obj, false); n++; }
    });
    if (n) save();
    return n;
  }

  function removeFromTopic(topicId, items) {
    var n = 0;
    (items || []).forEach(function (it) {
      var kind = it && it.kind, id = it && it.id;
      if (kind !== 'frag' && kind !== 'card') return;
      var obj = get(kind, id);
      if (!obj) return;
      var list = obj.topicIds || [];
      var i = list.indexOf(topicId);
      if (i >= 0) { list.splice(i, 1); stamp(obj, false); n++; }
    });
    if (n) save();
    return n;
  }

    var d = load();
    var full = raw();
    var loose = d.frags.filter(function (f) { return !f.topicIds.length; }).length;
    var looseCards = d.cards.filter(function (c) { return !(c.topicIds || []).length; }).length;
    var trash = 0;

    });

      frags: d.frags.length, loose: loose, cards: d.cards.length, looseCards: looseCards,
      topics: d.topics.length, articles: d.articles.length, trash: trash,
      words: d.frags.reduce(function (s, f) { return s + (f.text || '').length; }, 0)
    };
  }

     墓碑只需要活到「其他设备都同步过一轮」为止；再往后留着只是占地方。

    var now = Date.now();

      if (!Array.isArray(it.tags)) it.tags = [];

      if (!Array.isArray(it.sourceIds)) it.sourceIds = [];
      if (!Array.isArray(it.tags)) it.tags = [];
    } else if (kind === 'article') {
      it.title = String(it.title == null ? '' : it.title);
      it.body = String(it.body == null ? '' : it.body);
      if (!Array.isArray(it.sourceIds)) it.sourceIds = [];
      if (!Array.isArray(it.tags)) it.tags = [];
      if (typeof it.topicId !== 'string') it.topicId = '';
    } else if (kind === 'topic') {
      it.name = String(it.name == null ? '' : it.name);
      it.desc = String(it.desc == null ? '' : it.desc);
      if (!Array.isArray(it.keywords)) it.keywords = [];
      if (!it.hue) it.hue = '#C0824E';
    }
    it.createdAt = +it.createdAt || Date.now();
    it.updatedAt = +it.updatedAt || it.createdAt;
    it.deletedAt = +it.deletedAt || 0;
    it.rev = +it.rev || 1;
    it.deviceId = it.deviceId || '';
    return it;
  }

  /* 把远端胜出的记录合并进本地。
     这里刻意不走 update()：那条路径会重新盖一次版本戳，本机立刻变成
     「更新的一方」，下一轮又推回去，两台机器来回弹。
     远端带来的版本戳必须原样保留 —— 这正是同步能收敛的原因。 */
  function applyRemote(records) {
    var d = raw();
    var n = 0;
    (records || []).forEach(function (rec) {
      var kind = rec && rec.kind;
      var k = COLL[kind];
      if (!k || !rec.item || !rec.item.id) return;
      var item = ensureItem(kind, rec.item);
      var arr = d[k];
      var idx = -1;
      for (var i = 0; i < arr.length; i++) {
        if (arr[i].id === item.id) { idx = i; break; }
      }
      if (idx >= 0) arr[idx] = item;
      else arr.push(item);
      n++;
    });
    if (n) save(true);
    return n;
  }

  function graveCount() { return raw().graves.length; }

  global.DB = {
    KEY: KEY, DEVKEY: DEVKEY, uid: uid, load: load, save: save, reset: reset, replaceAll: replaceAll,
    list: list, get: get, add: add, update: update, remove: remove,
    sourcesOf: sourcesOf, refsOf: refsOf, stats: stats, seed: seed,
    fragsOfTopic: fragsOfTopic, cardsOfTopic: cardsOfTopic, articlesOfTopic: articlesOfTopic,

    addToTopic: addToTopic, removeFromTopic: removeFromTopic,

    deviceId: deviceId, raw: raw, compareVersion: compareVersion, purgeTrash: purgeTrash,

    hasGrave: hasGrave, graveCount: graveCount, ensureItem: ensureItem
  };
})(window);

<script>
/* ===========================================================
   灵感笔记 · 加密层
   口令 → 密钥 → 内容加解密。密钥只在这台设备的这次会话里

     二来让同一份代码在浏览器和离线测试环境里行为完全一致。 */

  function deriveKey(pass) {
    if (!WC) return Promise.reject(new Error('当前环境不支持加密'));
    var p = String(pass == null ? '' : pass);

          { name: 'PBKDF2', salt: utf8(SALT), iterations: ITER, hash: 'SHA-256' },
          base,
          { name: 'AES-GCM', length: 256 },
          true,               /* 可导出，仅用于算指纹 */
          ['encrypt', 'decrypt']

      });
  }

  /* 密钥指纹：两端各算一次比对，用来确认「口令有没有打错」。
     没有这道校验，打错口令的后果是静默的 —— 同步照常跑，只是永远是空的，
     而且旧数据一条都解不开。 */
  function fingerprint(key) {

     AES-GCM 自带校验：密文被改过一个字节，解密就会失败，而不是悄悄返回乱码。 */

  }

    available: available,
    deriveKey: deriveKey,
    fingerprint: fingerprint,
    encrypt: encrypt,
    decrypt: decrypt
  };
})(window);

  var CLUSTER_OF = {};     // 词 -> 族下标

  /* 词内单字（有意义、常作构词成分） */
  var MEANINGFUL = {};
  ('写读想看做说听学记改问答得知见闻观念意象感理心手口眼脑力时分秒年月日' +
   '文句词语字篇书信画图影视音声光色形影人事物情境场景动静快慢难易' +

  function isWordChar(ch) { return /[A-Za-z0-9]/.test(ch); }

  /* ---------- 切分：把文本切成原子的「候选单元」 ----------
     中文单字成原子，英文数字整串成原子。 */
  function atomize(text) {
    var atoms = [], buf = '', i, ch;

      if (/[\u4e00-\u9fff\u3400-\u4dbf]/.test(ch)) atoms.push({ t: ch, latin: false });

    if (buf) atoms.push({ t: buf, latin: true });
    return atoms;

  /* ---------- 构词：对中文原子序列做「最大匹配 + 凝固度」组合 ----------
     目标：得到像「注意力」「不属于」「重新」这样具备语义的片段，而不是滑窗碎片。 */
  function segmentWords(atoms) {
    var out = [], i = 0;
    while (i < atoms.length) {
      if (atoms[i].latin) { out.push(atoms[i].t); i++; continue; }

      // 1) 优先在词表中找最长匹配（2~4 字）
      var matched = null;
      for (var len = Math.min(4, atoms.length - i); len >= 2; len--) {
        var cand = '';
        var ok = true;
        for (var k = 0; k < len; k++) {
          if (atoms[i + k].latin) { ok = false; break; }
          cand += atoms[i + k].t;

        if (ok && LEX[cand]) { matched = cand; break; }

      if (matched) { out.push(matched); i += matched.length; continue; }

      var cur = atoms[i].t;

      if (next && !next.latin && MEANINGFUL[cur] && MEANINGFUL[next.t]) {

        continue;
      }
      out.push(cur);
      i++;
    }
    return out;
  }

  /* ---------- 关键词提取 ----------

  function tokenize(text) {

      if (order[w] == null) order[w] = idx;
    });

    var total = words.length || 1;
    var out = [];
    Object.keys(freq).forEach(function (w) {

      var len = w.length;

      else if (len === 1) signal = MEANINGFUL[w] ? 1.0 : 0.18;
      else if (len === 2) signal = 1.25;
      else if (len === 3) signal = 1.5;
      else signal = 1.6;

      var score = Math.pow(len, 1.15) * (1 + Math.log(1 + c) * 0.9) * signal;
      // 长度中性化：2 字实词通常是中文里最可靠的关键词，3-4 字未收录组合容易是偶然拼接

      else if (len === 3) score *= 1.0;

    out = out.filter(function (t) {

      for (var i = 0; i < multi.length; i++) if (multi[i].indexOf(t.w) >= 0) return false;

    var kept = [];

      if (t.w.length > 1) {

          var k = kept[i].w;
          if (k.indexOf(t.w) >= 0 && k.length > t.w.length && kept[i].score >= t.score * 0.85) return;
        }
      }
      kept.push(t);
    });
    return kept;
  }

  function keywords(text, n) {
    return tokenize(text).slice(0, n || 8).map(function (t) { return t.w; });
  }

  /* ---------- 语义特征向量 ----------
     维度 = 词 + 语义族。词态相似与概念相似被分开刻画，再按权重合并。 */
  var DIM = 20000, DIM_C = 9000;

  function hashStr(s) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  function vecOf(item) {
    if (item.__vec) return item.__vec;
    var text = item.text || ((item.title || '') + ' ' + (item.body || ''));
    var toks = tokenize(text);
    var v = { keys: {}, clusters: {}, norm: 1 };
    toks.forEach(function (t, rank) {
      var decay = 1 / (1 + rank * 0.22);          // 排名越靠前权重越大
      var w = Math.log(1 + t.score) * decay;
      if (t.w.length === 1 && t.signal <= 0.2) return;

      var d = hashStr(t.w) % DIM;

      var ci = CLUSTER_OF[t.w];
      if (ci != null) {

  function cosSparse(a, b) {

  /* ---------- 相似度 ---------- */
  function bigrams(s) {

    for (var i = 0; i < t.length - 1; i++) set[t.slice(i, i + 2)] = 1;
    if (!set.length && t.length) set[t] = 1;
    return set;

  function dice(a, b) {
    var A = bigrams(a), B = bigrams(b);
    var ka = Object.keys(A), kb = Object.keys(B);
    if (!ka.length || !kb.length) return 0;
    var inter = 0;
    ka.forEach(function (k) { if (B[k]) inter++; });
    return (2 * inter) / (ka.length + kb.length);
  }

  function textOf(x) { return x.text || ((x.title || '') + ' ' + (x.body || '')); }

  function similarity(a, b) {
    if (a === b) return 1;
    var va = vecOf(a), vb = vecOf(b);
    var sWord = cosSparse(va.keys, vb.keys);      // 词态相似
    var sConcept = cosSparse(va.clusters, vb.clusters); // 概念相似
    var sDice = dice(textOf(a), textOf(b));       // 字面相似

    var score = sWord * 0.40 + sConcept * 0.42 + sDice * 0.18;

    // 主题一致加成
    var ta = a.topicIds || (a.topicId ? [a.topicId] : []);
    var tb = b.topicIds || (b.topicId ? [b.topicId] : []);
    if (ta.length && tb.length) {

      if (shared.length) score = score * 0.88 + 0.12 * Math.min(1, shared.length / Math.max(ta.length, tb.length) + 0.45);

  function readable(score) {

    return Math.max(0, Math.min(1, v));

  function findSimilar(text, opts) {
    opts = opts || {};

    var limit = opts.limit || 3;

    // 阈值按可读分数比较，便于调参
    var pool = [];
    var probe = { text: text, tags: opts.tags || [], topicIds: opts.topicIds || [], __vec: null };

    DB.load().frags.forEach(function (f) {
      if (f.id === excludeId) return;
      var raw = similarity(probe, f);
      pool.push({ kind: 'frag', item: f, sim: raw, display: readable(raw) });
    });
    if (opts.includeCards !== false) {
      DB.load().cards.forEach(function (c) {
        if (c.id === excludeId) return;
        var raw = similarity(probe, c);
        pool.push({ kind: 'card', item: c, sim: raw, display: readable(raw) });
      });
    }
    pool.sort(function (a, b) { return b.sim - a.sim; });
    return pool.filter(function (p) { return p.display >= floor; }).slice(0, limit);
  }

  function similarityClusters(floor) {
    var items = [];
    DB.load().frags.forEach(function (f) { items.push({ kind: 'frag', item: f }); });
    DB.load().cards.forEach(function (c) { items.push({ kind: 'card', item: c }); });
    var edges = [];
    var th = floor == null ? 0.45 : floor;
    for (var i = 0; i < items.length; i++) {
      for (var j = i + 1; j < items.length; j++) {

        var d = readable(raw);
        if (d >= th) edges.push({ a: items[i], b: items[j], sim: raw, display: d });

    edges.sort(function (x, y) { return y.display - x.display; });
    return edges.slice(0, 40);
