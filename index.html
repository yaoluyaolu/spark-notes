  /* 文章取材：既可按主题筛，也可从全库挑 */
  function renderArticlePicker(id, topicFilter) {
    var host = $('#ed_picker');
    if (!host) return;
    var it = DB.get('article', id);
    if (!it) return;
    var taken = it.sourceIds || [];

    var cards, frags, scopeNote;
    if (topicFilter) {
      var tp = topicById(topicFilter);
      cards = DB.cardsOfTopic(topicFilter);
      frags = DB.fragsOfTopic(topicFilter);
      scopeNote = '「' + (tp ? tp.name : '') + '」下有 ' + cards.length + ' 张卡片、' + frags.length + ' 条灵感';
    } else {
      cards = DB.list('card');
      frags = [];
      scopeNote = '从全部 ' + cards.length + ' 张卡片中挑';
    }
    var availCards = cards.filter(function (c) { return taken.indexOf(c.id) < 0; });
    var availFrags = frags.filter(function (f) { return taken.indexOf(f.id) < 0; });

    var html = '<label>素材来源 · ' + (topicFilter ? '按主题取材' : '从全库取材') + '</label>' +
      '<span class="field-note" style="display:block;margin:-2px 0 8px">' + esc(scopeNote) + '</span>';

    if (availCards.length) {
      html += '<div class="src-list">' + availCards.map(function (c) {
        return '<div class="src-row"><span class="sr-text">' + esc(firstLine(c.title, 34)) + '</span>' +
          '<button class="btn btn-sm btn-ghost" data-act="linkCard" data-id="' + c.id + '">引用</button>' +
          '<button class="btn btn-sm btn-ghost" data-act="insertCard" data-id="' + c.id + '">插入正文</button>' +
          '</div>';
      }).join('') + '</div>';
    } else {
      html += '<span class="field-note">' + (topicFilter ? '这个主题下的卡片都已引用。' : '卡片已全部引用，或还没有卡片。') + '</span>';
    }

    if (topicFilter) {
      if (availFrags.length) {
        html += '<label style="margin-top:12px">主题里的灵感（可直接插入正文）</label>' +
          '<div class="src-list">' + availFrags.map(function (f) {
            return '<div class="src-row"><span class="sr-text">' + esc(firstLine(f.text, 40)) + '</span>' +
              '<button class="btn btn-sm btn-ghost" data-act="insertFrag" data-id="' + f.id + '">插入正文</button>' +
              '<button class="btn btn-sm btn-ghost" data-act="linkFrag" data-id="' + f.id + '">引用</button>' +
              '</div>';
          }).join('') + '</div>';
      } else {
        html += '<span class="field-note" style="display:block;margin-top:10px">这个主题下的灵感都已引用。</span>';
      }
    }

    host.innerHTML = html;
  }

  function closeSheet(sel) {
    var el = $(sel);
    if (el) el.hidden = true;
    if (sel === '#editMask') S.editing = null;
  }

  function saveEdit() {
    if (!S.editing) return;
    var k = S.editing.kind, id = S.editing.id;
    if (k === 'frag') {
      var text = $('#ed_text').value.trim();
      if (!text) { toast('内容不能为空', 'warn'); return; }
      var tags = ($('#ed_tags').value || '').split(/[,，、\s]+/).filter(Boolean);
      var tids = S._editTopicIds || DB.get('frag', id).topicIds;
      DB.update('frag', id, { text: text, tags: tags, topicIds: tids, done: tids.length > 0 });
    } else if (k === 'card') {
      var title = $('#ed_title').value.trim();
      if (!title) { toast('标题不能为空', 'warn'); return; }
      var ctids = S._editCardTopicIds || (DB.get('card', id).topicIds || []).slice();
      DB.update('card', id, {
        title: title, body: $('#ed_body').value,
        topicIds: ctids,
        tags: ($('#ed_tags2').value || '').split(/[,，、\s]+/).filter(Boolean)
      });
    } else if (k === 'article') {
      var t2 = $('#ed_title').value.trim();
      if (!t2) { toast('标题不能为空', 'warn'); return; }
      DB.update('article', id, { title: t2, body: $('#ed_body').value, topicId: $('#ed_topic').value });
    } else if (k === 'topic') {
      var name = $('#ed_name').value.trim();
      if (!name) { toast('名称不能为空', 'warn'); return; }
      var kws = ($('#ed_kw').value || '').split(/[,，、\s]+/).filter(Boolean);
      DB.update('topic', id, {
        name: name, desc: $('#ed_desc').value.trim(),
        keywords: kws, hue: S._editHue || DB.get('topic', id).hue
      });
    }
    closeSheet('#editMask');
    render();
    toast('已保存', 'good');
  }

  /* ===========================================================
     聚合：灵感 → 卡片
     =========================================================== */
  function makeCardFrom(ids) {
    var frags = ids.map(function (id) { return DB.get('frag', id); }).filter(Boolean);
    if (!frags.length) return;
    var merged = frags.map(function (f) { return f.text; }).join('\n\n');
    var kw = Engine.keywords(merged, 6);
    var defaultTitle = kw.slice(0, 3).join(' · ') || '新卡片';
    // 主题从来源灵感继承（灵感可能挂多个主题，全部带上）
    var inherit = [];
    frags.forEach(function (f) {
      (f.topicIds || []).forEach(function (tid) { if (inherit.indexOf(tid) < 0) inherit.push(tid); });
    });
    S._cardDraft = { title: defaultTitle, body: merged, topicIds: inherit, sourceIds: ids.slice() };
    S._editCardTopicIds = inherit.slice();

    S.editing = { kind: 'card', id: null, draft: S._cardDraft };
    $('#editLabel').textContent = '聚合成知识卡片';
    $('#editBody').innerHTML =
      '<div class="sim-head" style="color:var(--accent-deep);margin-bottom:4px">' +
        '<svg class="ico" viewBox="0 0 16 16"><path d="M8 1.5 L9.8 6.2 L14.5 8 L9.8 9.8 L8 14.5 L6.2 9.8 L1.5 8 L6.2 6.2 Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>' +
        '将 ' + frags.length + ' 条灵感合并为一张卡片</div>' +
      buildEditForm('card', null, S._cardDraft) +
      '<div class="field"><label>即将聚合的灵感</label><div class="src-list">' +
        frags.map(function (f) {
          return '<div class="src-row"><span class="sr-text">' + esc(firstLine(f.text, 70)) + '</span></div>';
        }).join('') + '</div></div>';
    // 新建草稿还没有实体，删除按钮必须隐藏
    $('#editDelete').hidden = true;
    $('#editHint').textContent = '标题可改，正文可继续打磨';
    $('#editMask').hidden = false;
  }

  function saveNewCard() {
    var d = S._cardDraft;
    if (!d) return;
    var title = $('#ed_title').value.trim();
    if (!title) { toast('标题不能为空', 'warn'); return; }
    var tids = S._editCardTopicIds || d.topicIds || [];
    var c = DB.add('card', {
      title: title, body: $('#ed_body').value, topicIds: tids.slice(),
      sourceIds: d.sourceIds.slice(),
      tags: ($('#ed_tags2').value || '').split(/[,，、\s]+/).filter(Boolean)
    });
    S._cardDraft = null;
    S._editCardTopicIds = null;
    closeSheet('#editMask');
    S.view = 'cards';
    syncTabs();
    S.activeCardId = c.id;
    render();
    toast(tids.length ? '卡片已生成 · 已归入 ' + tids.length + ' 个主题' : '卡片已生成 · 可稍后归入主题', 'good');
  }

  /* ===========================================================
     主题
     =========================================================== */
  var HUES = ['#C0824E', '#7E9179', '#B8735C', '#B08A3C', '#8C7BA6', '#6E8CA0'];

  function createTopic() {
    var name = prompt('主题名称：', '');
    if (!name) return;
    name = name.trim();
    if (!name) return;
    var exists = DB.load().topics.some(function (t) { return t.name === name; });
    if (exists) { toast('同名主题已存在', 'warn'); return; }
    var t = DB.add('topic', {
      name: name, desc: '', keywords: Engine.keywords(name, 4),
      hue: HUES[DB.load().topics.length % HUES.length]
    });
    render();
    toast('主题「' + t.name + '」已创建', 'good');
    return t;
  }

  function acceptSuggestion(fragId, topicId) {
    var t = topicById(topicId);
    if (!t) return;
    DB.update('frag', fragId, { topicIds: [topicId], done: true });
    render();
    toast('已归入「' + t.name + '」', 'good');
  }

  /* ===========================================================
     删除（灵感 / 卡片 / 文章 / 主题）
     =========================================================== */
  var DEL_META = {
    frag:    { name: '灵感', title: function (it) { return firstLine(it.text, 24); } },
    card:    { name: '卡片', title: function (it) { return it.title; } },
    article: { name: '文章', title: function (it) { return it.title; } },
    topic:   { name: '主题', title: function (it) { return it.name; } }
  };

  /* 统计这条内容牵动了什么，用于给出「会连带发生什么」的确认提示 */
  function delImpact(kind, id) {
    var d = DB.load();
    var lines = [];
    if (kind === 'topic') {
      var nf = d.frags.filter(function (f) { return (f.topicIds || []).indexOf(id) >= 0; }).length;
      var nc = d.cards.filter(function (c) { return (c.topicIds || []).indexOf(id) >= 0; }).length;
      var na = d.articles.filter(function (a) { return a.topicId === id; }).length;
      if (nf) lines.push(nf + ' 条灵感将变为未归类');
      if (nc) lines.push(nc + ' 张卡片将变为未归类');
      if (na) lines.push(na + ' 篇文章将变为未归类');
    } else if (kind === 'card') {
      var refs = d.articles.filter(function (a) { return (a.sourceIds || []).indexOf(id) >= 0; }).length;
      if (refs) lines.push('已被 ' + refs + ' 篇文章引用，引用关系将一并移除');
    } else if (kind === 'frag') {
      var asCard = d.cards.filter(function (c) { return (c.sourceIds || []).indexOf(id) >= 0; }).length;
      var asArt = d.articles.filter(function (a) { return (a.sourceIds || []).indexOf(id) >= 0; }).length;
      if (asCard) lines.push('已被 ' + asCard + ' 张卡片作为来源，来源关系将一并移除');
      if (asArt) lines.push('已被 ' + asArt + ' 篇文章引用，引用关系将一并移除');
    }
    return lines;
  }

  function deleteItem(kind, id) {
    var meta = DEL_META[kind];
    if (!meta) return false;
    var it = DB.get(kind, id);
    if (!it) return false;

    var msg = '删除' + meta.name + '「' + meta.title(it) + '」？\n\n此操作不可撤销。';
    var impact = delImpact(kind, id);
    if (impact.length) msg += '\n\n' + impact.map(function (s) { return '· ' + s; }).join('\n');
    if (!confirm(msg)) return false;

    DB.remove(kind, id);

    // 清掉指向它的界面状态，避免停留在一条已被删除的内容上
    if (kind === 'topic' && S.activeTopicId === id) S.activeTopicId = '';
    if (kind === 'card' && S.activeCardId === id) S.activeCardId = '';
    if (kind === 'article' && S.activeArticleId === id) S.activeArticleId = '';
    if (kind === 'frag' && S.openFragId === id) S.openFragId = '';

    if (S.editing && S.editing.kind === kind && S.editing.id === id) {
      closeSheet('#editMask');
      S.editing = null;
    }
    render();
    toast('已删除' + meta.name, 'good');
    return true;
  }

  /* ===========================================================
     合并迭代
     =========================================================== */
  function mergeInto(kind, id) {
    var p = composePayload();
    if (!p.body) { toast('先写下内容', 'warn'); return; }
    var target = DB.get(kind, id);
    if (!target) return;

    var piece = (p.isCard && p.title ? '## ' + p.title + '\n\n' : '') + p.body;
    if (kind === 'card') {
      DB.update('card', id, { body: (target.body || '') + '\n\n— — —\n\n' + piece });
      toast('已并入卡片', 'good');
    } else {
      // 灵感：合并成一条，保留较早的时间
      DB.update('frag', id, { text: (target.text || '') + '\n\n' + piece });
      toast('已迭代原灵感（两条已合一）', 'good');
    }
    closeSheet('#composeMask');
    if (kind === 'card') S.view = 'cards';
    else if (S.view === 'cards' || S.view === 'articles') S.view = 'inbox';
    syncTabs();
    render();
  }

  /* ===========================================================
     关系视图
     =========================================================== */
  function drawGraph() {
    var svg = $('#graphSvg');
    var stage = $('#graphStage');
    // 尺寸兜底：浮层刚显示时有时取不到尺寸
    var W = stage.clientWidth || stage.offsetWidth || svg.clientWidth || window.innerWidth;
    var H = stage.clientHeight || stage.offsetHeight || svg.clientHeight || (window.innerHeight - 90);
    W = Math.max(320, Math.round(W));
    H = Math.max(320, Math.round(H));
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

    var d = DB.load();
    var nodes = [];
    d.topics.forEach(function (t, i) {
      nodes.push({ id: t.id, kind: 'topic', label: t.name, r: 9 + Math.sqrt(cntTopic(t.id)) * 2.1, hue: t.hue, type: 'topic' });
    });
    d.cards.forEach(function (c) { nodes.push({ id: c.id, kind: 'card', label: c.title, r: 7, hue: '#7E9179', type: 'card' }); });
    d.frags.forEach(function (f) { nodes.push({ id: f.id, kind: 'frag', label: firstLine(f.text, 16), r: 4.6, hue: '#C0824E', type: 'frag' }); });

    if (!nodes.length) {
      svg.innerHTML = '';
      toast('还没有内容可以绘制', 'warn');
      return;
    }

    // 力导向布局（简易模拟）
    var cx = W / 2, cy = H / 2;
    var idx = {};
    nodes.forEach(function (n, i) {
      idx[n.id] = i;
      var ang = (i / nodes.length) * Math.PI * 2;
      var rad = n.type === 'topic' ? Math.min(W, H) * 0.3 : Math.min(W, H) * (0.18 + Math.random() * 0.3);
      n.x = cx + Math.cos(ang) * rad;
      n.y = cy + Math.sin(ang) * rad;
      n.vx = 0; n.vy = 0;
    });

    var links = [];
    d.frags.forEach(function (f) {
      (f.topicIds || []).forEach(function (tid) { if (idx[tid] != null) links.push({ s: idx[f.id], t: idx[tid], w: 1.1, k: 'ft' }); });
    });
    d.cards.forEach(function (c) {
      (c.topicIds || []).forEach(function (tid) {
        if (idx[tid] != null) links.push({ s: idx[c.id], t: idx[tid], w: 1.4, k: 'ct' });
      });
      (c.sourceIds || []).forEach(function (sid) {
        if (idx[sid] != null) links.push({ s: idx[c.id], t: idx[sid], w: 0.9, k: 'cf' });
      });
    });
    d.articles.forEach(function (a) {
      if (idx[a.id] != null && a.topicId && idx[a.topicId] != null) links.push({ s: idx[a.id], t: idx[a.topicId], w: 1.6, k: 'at' });
    });

    // 相似连线（灵感之间）
    for (var i = 0; i < d.frags.length; i++) {
      for (var j = i + 1; j < d.frags.length; j++) {
        var s = Engine.similarity(d.frags[i], d.frags[j]);
        if (s >= 0.24) links.push({ s: idx[d.frags[i].id], t: idx[d.frags[j].id], w: 0.7, k: 'sim', sim: s });
      }
    }

    var ITER = 260;
    for (var it = 0; it < ITER; it++) {
      // 斥力
      for (i = 0; i < nodes.length; i++) {
        for (j = i + 1; j < nodes.length; j++) {
          var a = nodes[i], b = nodes[j];
          var dx = b.x - a.x, dy = b.y - a.y;
          var dist2 = dx * dx + dy * dy || 0.01;
          var dist = Math.sqrt(dist2);
          var force = 4200 / dist2;
          var fx = (dx / dist) * force, fy = (dy / dist) * force;
          a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
        }
      }
      // 引力
      links.forEach(function (l) {
        var a = nodes[l.s], b = nodes[l.t];
        var dx = b.x - a.x, dy = b.y - a.y;
        var dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
        var target = l.k === 'ft' ? 96 : l.k === 'ct' ? 110 : l.k === 'sim' ? 130 : 100;
        var f = (dist - target) * 0.012 * l.w;
        var fx = (dx / dist) * f, fy = (dy / dist) * f;
        a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
      });
      // 向心 + 阻尼
      nodes.forEach(function (n) {
        n.vx += (cx - n.x) * 0.0022;
        n.vy += (cy - n.y) * 0.0022;
        n.vx *= 0.86; n.vy *= 0.86;
        n.x += n.vx; n.y += n.vy;
        n.x = Math.max(16, Math.min(W - 16, n.x));
        n.y = Math.max(16, Math.min(H - 16, n.y));
      });
    }

    var out = '';
    links.forEach(function (l) {
      var a = nodes[l.s], b = nodes[l.t];
      var color = l.k === 'sim' ? '#C0824E' : l.k === 'ct' ? '#7E9179' : l.k === 'at' ? '#B8735C' : '#DFD6C4';
      var op = l.k === 'sim' ? 0.4 : 0.55;
      out += '<line x1="' + a.x.toFixed(1) + '" y1="' + a.y.toFixed(1) + '" x2="' + b.x.toFixed(1) + '" y2="' + b.y.toFixed(1) +
        '" stroke="' + color + '" stroke-width="' + l.w + '" stroke-opacity="' + op + '"' +
        (l.k === 'sim' ? ' stroke-dasharray="3 3"' : '') + '/>';
    });

    nodes.forEach(function (n) {
      var label = n.type === 'topic' ? '<text x="' + n.x.toFixed(1) + '" y="' + (n.y - n.r - 7).toFixed(1) + '" text-anchor="middle" class="gn-label-strong">' + esc(n.label) + '</text>' : '';
      var shape;
      if (n.type === 'card') {
        var s2 = n.r * 1.5;
        shape = '<rect x="' + (n.x - s2 / 2).toFixed(1) + '" y="' + (n.y - s2 / 2).toFixed(1) + '" width="' + s2.toFixed(1) + '" height="' + s2.toFixed(1) +
          '" rx="3" fill="' + hexA(n.hue, 0.9) + '" stroke="' + n.hue + '" stroke-width="1"/>';
      } else {
        shape = '<circle cx="' + n.x.toFixed(1) + '" cy="' + n.y.toFixed(1) + '" r="' + n.r.toFixed(1) +
          '" fill="' + hexA(n.hue, n.type === 'topic' ? 0.85 : 0.62) + '" stroke="' + n.hue + '" stroke-width="' + (n.type === 'topic' ? 1.4 : 1) + '"/>';
      }
      var tip = n.type === 'frag' ? '<title>' + esc(n.label) + '</title>' : '';
      out += '<g class="gnode" data-id="' + n.id + '" data-kind="' + n.kind + '">' + shape + label + tip + '</g>';
    });

    svg.innerHTML = out;
    $$('.gnode', svg).forEach(function (g) {
      g.addEventListener('click', function () {
        var kind = g.getAttribute('data-kind'), id = g.getAttribute('data-id');
        $('#graphLayer').hidden = true;
        gotoItem(kind, id);
      });
    });
  }

  function cntTopic(tid) {
    var n = DB.load().frags.filter(function (f) { return (f.topicIds || []).indexOf(tid) >= 0; }).length;
    n += DB.load().cards.filter(function (c) { return (c.topicIds || []).indexOf(tid) >= 0; }).length * 2;
    return n;
  }

  function gotoItem(kind, id) {
    if (kind === 'frag') {
      var f = DB.get('frag', id);
      if (!f) return;
      if ((f.topicIds || []).length) { S.view = 'topics'; S.activeTopicId = f.topicIds[0]; }
      else { S.view = 'inbox'; S.activeTopicId = ''; }
      S.openFragId = id;
      syncTabs(); render();
      var el = $('.frag[data-id="' + id + '"]');
      if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    } else if (kind === 'card') {
      S.view = 'cards'; S.activeCardId = id; syncTabs(); render();
      openEdit('card', id);
    } else if (kind === 'topic') {
      S.view = 'topics'; S.activeTopicId = id; syncTabs(); render();
    } else if (kind === 'article') {
      S.view = 'articles'; S.activeArticleId = id; syncTabs(); render();
      openEdit('article', id);
    }
  }

  /* ===========================================================
     数据面板
     =========================================================== */
  function renderData() {
    var st = DB.stats();
    $('#dataStats').innerHTML =
      stat(st.frags, '灵感') + stat(st.loose, '待归类') + stat(st.cards, '卡片') +
      stat(st.articles, '文章') + stat(st.topics, '主题') + stat(st.words, '总字数') +
      stat(Engine.similarityClusters(0.24).length, '相似关联') +
      stat(Math.round(JSON.stringify(DB.load()).length / 1024) + 'K', '占用');
  }
  function stat(n, label) {
    return '<div class="stat"><b>' + n + '</b><span>' + label + '</span></div>';
  }

  function exportJSON() {
    var blob = new Blob([JSON.stringify(DB.load(), null, 2)], { type: 'application/json' });
    downloadBlob(blob, 'spark-notes-' + dateStr(Date.now()) + '.json');
    toast('已导出备份', 'good');
  }

  function exportMarkdown() {
    var d = DB.load();
    var lines = ['# 灵感笔记导出', '', '导出时间：' + new Date().toLocaleString('zh-CN'), '',
      '共 ' + d.frags.length + ' 条灵感、' + d.cards.length + ' 张卡片、' + d.articles.length + ' 篇文章', '', '---', ''];

    d.topics.forEach(function (t) {
      lines.push('## 主题：' + t.name);
      if (t.desc) lines.push('> ' + t.desc);
      lines.push('');
      d.frags.filter(function (f) { return (f.topicIds || []).indexOf(t.id) >= 0; })
        .forEach(function (f) { lines.push('- ' + f.text.replace(/\n/g, ' ') + '  `' + dateStr(f.createdAt) + '`'); });
      lines.push('');
      d.cards.filter(function (c) { return (c.topicIds || []).indexOf(t.id) >= 0; }).forEach(function (c) {
        lines.push('### ' + c.title); lines.push(''); lines.push(c.body); lines.push('');
      });
      d.articles.filter(function (a) { return a.topicId === t.id; }).forEach(function (a) {
        lines.push('# ' + a.title); lines.push(''); lines.push(a.body); lines.push('');
      });
    });

    var loose = d.frags.filter(function (f) { return !(f.topicIds || []).length; });
    if (loose.length) {
      lines.push('## 未归类灵感'); lines.push('');
      loose.forEach(function (f) { lines.push('- ' + f.text.replace(/\n/g, ' ')); });
    }

    downloadBlob(new Blob([lines.join('\n')], { type: 'text/markdown;charset=utf-8' }),
      'spark-notes-' + dateStr(Date.now()) + '.md');
    toast('已导出 Markdown', 'good');
  }

  function downloadBlob(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  }

  function importJSON(file) {
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var obj = JSON.parse(fr.result);
        if (!obj || typeof obj !== 'object') throw new Error('bad');
        DB.replaceAll(obj);
        S.view = 'inbox'; S.activeTopicId = ''; S.activeCardId = ''; S.activeArticleId = '';
        syncTabs(); render();
        toast('导入成功', 'good');
      } catch (e) {
        toast('文件格式不正确', 'warn');
      }
    };
    fr.readAsText(file, 'utf-8');
  }

  function copyText(t) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function () { toast('已复制'); }, function () { fallbackCopy(t); });
    } else fallbackCopy(t);
  }
  function fallbackCopy(t) {
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已复制'); } catch (e) { toast('复制失败', 'warn'); }
    document.body.removeChild(ta);
  }

  /* ===========================================================
     跨模块批量操作
     =========================================================== */
  function batchAcceptAll() {
    var sugs = Engine.suggestForLoose(50);
    if (!sugs.length) { toast('暂无可以自动归类的灵感'); return; }
    sugs.forEach(function (s) {
      DB.update('frag', s.frag.id, { topicIds: [s.rec.topicId], done: true });
    });
    render();
    toast('已自动归类 ' + sugs.length + ' 条灵感', 'good');
  }

  /* ===========================================================
     事件绑定
     =========================================================== */
  function syncTabs() {
    $$('.tab').forEach(function (b) {
      b.classList.toggle('is-active', b.getAttribute('data-view') === S.view);
    });
    $$('.chip[data-filter]').forEach(function (b) {
      b.classList.toggle('is-on', b.getAttribute('data-filter') === S.filter);
    });
  }

  function bind() {
    // 页签
    $('#tabs').addEventListener('click', function (e) {
      var tab = e.target.closest('.tab');
      if (tab) {
        S.view = tab.getAttribute('data-view');
        if (S.view !== 'topics') S.activeTopicId = '';
        if (S.view !== 'cards') S.activeCardId = '';
        if (S.view !== 'articles') S.activeArticleId = '';
        syncTabs(); render();
        return;
      }
      var chip = e.target.closest('.chip[data-filter]');
      if (chip) {
        S.filter = chip.getAttribute('data-filter');
        syncTabs(); render();
      }
    });

    $('#sortBy').addEventListener('change', function () { S.sort = this.value; render(); });

    $('#toggleRel').addEventListener('click', function () {
      S.showRel = !S.showRel;
      this.style.background = S.showRel ? 'var(--accent-soft)' : 'transparent';
      this.style.color = S.showRel ? 'var(--accent-deep)' : '';
      render();
      toast(S.showRel ? '关联提示已开启' : '关联提示已关闭');
    });

    // 搜索
    var st_;
    $('#globalSearch').addEventListener('input', function () {
      var v = this.value;
      clearTimeout(st_);
      st_ = setTimeout(function () {
        S.query = v.trim();
        render();
        if (S.query) status('搜索「' + S.query + '」· ' + ($$('#primaryList .frag, #primaryList .card-item').length) + ' 个结果');
      }, 180);
    });

    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault(); $('#globalSearch').focus(); $('#globalSearch').select();
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'j') {
        e.preventDefault();
        openCompose(e.shiftKey ? 'card' : 'frag');
      }
      if (e.key === 'Escape') {
        $$('.sheet-mask').forEach(function (m) { if (!m.hidden) m.hidden = true; });
        $('#graphLayer').hidden = true;
        S.editing = null;
      }
    });

    // 主区点击
    $('#primaryList').addEventListener('click', function (e) {
      var actEl = e.target.closest('[data-act]');
      if (actEl) {
        var act = actEl.getAttribute('data-act');
        var id = actEl.getAttribute('data-id');
        if (act === 'accept') { e.stopPropagation(); acceptSuggestion(id, actEl.getAttribute('data-topic') || (Engine.classify((DB.get('frag', id) || {}).text, []).topicId)); return; }
        if (act === 'edit') { openEdit('frag', id); return; }
        if (act === 'card') { makeCardFrom([id]); return; }
        if (act === 'star') { var f = DB.get('frag', id); DB.update('frag', id, { star: !f.star }); render(); return; }
        if (act === 'copy') { copyText(DB.get('frag', id).text); return; }
        if (act === 'del') {
          deleteItem('frag', id);
          return;
        }
        if (act === 'delCard') { e.stopPropagation(); deleteItem('card', id); return; }
        if (act === 'delArticle') { e.stopPropagation(); deleteItem('article', id); return; }
        if (act === 'delTopic') { e.stopPropagation(); deleteItem('topic', id); return; }
        if (act === 'goto') {
          e.stopPropagation();
          gotoItem(actEl.getAttribute('data-kind'), id);
          return;
        }
        if (act === 'clearSearch') {
          $('#globalSearch').value = ''; S.query = ''; render(); return;
        }
        if (act === 'composeNow') { openCompose(); return; }
        if (act === 'newCard') { openCompose('card'); return; }
        if (act === 'openCard') { openEdit('card', id); return; }
        if (act === 'openArticle') { openEdit('article', id); return; }
        // 主题工作台
        if (act === 'openCollect') {
          e.stopPropagation();
          openCollect(id, actEl.getAttribute('data-tab') || 'all');
          return;
        }
        if (act === 'editTopic') { e.stopPropagation(); openEdit('topic', id); return; }
        if (act === 'writeFromTopic') { e.stopPropagation(); writeFromTopic(id); return; }
        if (act === 'pullOut') {
          e.stopPropagation();
          var pk = actEl.getAttribute('data-kind');
          DB.removeFromTopic(S.activeTopicId, [{ kind: pk, id: id }]);
          render();
          toast(pk === 'frag' ? '已移出主题' : '已移出主题');
          return;
        }
      }
      var frag = e.target.closest('.frag');
      if (frag) {
        var fid = frag.getAttribute('data-id');
        S.openFragId = S.openFragId === fid ? '' : fid;
        renderFrags();
        return;
      }
      var ci = e.target.closest('.card-item');
      if (ci) {
        var cid = ci.getAttribute('data-id');
        if (S.view === 'cards') openEdit('card', cid);
        else if (S.view === 'articles') openEdit('article', cid);
      }
    });

    // 右侧面板
    $('#secondaryList').addEventListener('click', function (e) {
      var el = e.target.closest('[data-act]');
      if (!el) return;
      var act = el.getAttribute('data-act');
      var id = el.getAttribute('data-id');
      if (act === 'newTopic') { createTopic(); return; }
      if (act === 'acceptAll') { batchAcceptAll(); return; }
      if (act === 'newArticle') { newArticle(); return; }
      if (act === 'newCard') { openCompose('card'); return; }
      // 删除按钮嵌在可选中的卡片里，closest 会先命中它，这里必须直接返回
      if (act === 'delTopic') { e.stopPropagation(); deleteItem('topic', id); return; }
      if (act === 'delCard') { e.stopPropagation(); deleteItem('card', id); return; }
      if (act === 'delArticle') { e.stopPropagation(); deleteItem('article', id); return; }
      if (act === 'pickTopic') {
        S.view = 'topics';
        S.activeTopicId = S.activeTopicId === id ? '' : id;
        syncTabs(); render();
        if (window.innerWidth <= 980) $('#app').classList.add('show-secondary');
        return;
      }
      if (act === 'pickCard') { S.activeCardId = id; render(); openEdit('card', id); return; }
      if (act === 'pickArticle') { S.activeArticleId = id; render(); openEdit('article', id); return; }
      if (act === 'accept') {
        e.stopPropagation();
        acceptSuggestion(id, el.getAttribute('data-topic'));
        return;
      }
    });

    // 记录面板 —— 顶栏按钮默认写「当前视图最想记的那种」
    $('#btnCompose').addEventListener('click', function () {
      openCompose(S.view === 'cards' ? 'card' : 'frag');
    });
    $('#composeKind').addEventListener('click', function (e) {
      var b = e.target.closest('.kind-btn');
      if (!b) return;
      S.composeKind = b.getAttribute('data-kind') === 'card' ? 'card' : 'frag';
      applyComposeKind();
      // 刚切过来、还什么都没写时，把光标放到标题上
      if (S.composeKind === 'card' && !$('#composeText').value.trim()) {
        setTimeout(function () { $('#composeTitle').focus(); }, 30);
      }
      onComposeInput(120);
    });
    $('#composeTitle').addEventListener('input', function () { onComposeInput(280); });
    $('#composeTitle').addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); saveCompose(); return; }
      // 标题写完了按回车，直接跳到正文
      if (e.key === 'Enter') { e.preventDefault(); $('#composeText').focus(); }
    });
    $('#composeText').addEventListener('input', function () { onComposeInput(280); });
    $('#composeTags').addEventListener('input', function () { onComposeInput(360); });
    $('#composeText').addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); saveCompose(); }
    });
    $('#composeSheet').addEventListener('click', function (e) {
      var el = e.target.closest('[data-act]');
      if (!el) return;
      var act = el.getAttribute('data-act');
      if (act === 'toggleTopic') {
        var tid = el.getAttribute('data-id');
        var i = S.composeTopics.indexOf(tid);
        if (i >= 0) S.composeTopics.splice(i, 1); else S.composeTopics.push(tid);
        renderComposeTopics(); runComposeAnalysis();

  function syncLine() {
    if (!Sync.configured()) return '本地保存 · 未开启同步';
    if (!Sync.connected()) return '本地保存 · 待登录';
    var st = Sync.getState();
    if (st.phase === 'busy') return '正在同步…';
    if (st.phase === 'error') return '同步出错';
    if (!st.at) return '本地保存 · 已连接';
    if (st.broken) return '已同步 · ' + st.broken + ' 条读不了';
    return '已同步 · ' + when(st.at);
  }

  /* 口令不一致时，界面必须把话说完整。
     这是最隐蔽的一类故障：同步照常跑、不报错，只是「内容看不见」——
     用户看到一句「3 条解不开」根本无从下手，只能来问。 */
  function syncWarnHTML(st) {
    if (!st.broken) return '';
    var h = '<b>有 ' + st.broken + ' 条云端内容读不了。</b>' +
      '多半不是数据坏了，而是<b>两台设备算出的密钥不一样</b> —— ' +
      '最常把「登录密码」填进了「同步口令」那栏。';
    h += '<br>两台设备都打开「同步」面板，看下面那一行 <span class="sync-fp">key …</span> 的指纹：' +
      '<b>两台必须一样</b>。不一样的那台，把同步口令改成正确值，再点一次「登录并启用」。';
    if (st.healed) {
      h += '<br>本机手里也有其中 ' + st.healed + ' 条，已用本机版本重新加密上传，另一台拉一次就能看见。';
    }
    if (st.dangling) {
      h += '<br>另有 ' + st.dangling + ' 条本机没有。它们要等「手里有这条内容的那台设备」' +
        '用正确口令同步一次才会恢复。' +
        '<button class="sync-inline-btn" id="syncForget" type="button">清掉这 ' + st.dangling + ' 条</button>';
    }
    return h;
  }

  function syncDetailText(st) {
    if (!Sync.configured()) return '填好下面几项，登录后即可在两台设备间互通';
    if (!Sync.connected()) return '配置已填好，点「登录并启用」';
    if (st.phase === 'busy') return '正在与云端对账…';
    if (st.phase === 'error') return st.error || '同步失败';
    if (!st.at) return '点「立即同步」跑第一轮';
    if (st.broken) {
      var s = '有 ' + st.broken + ' 条读不了（多为两台设备口令不一致）';
      if (st.healed) s += '，已重新推上去 ' + st.healed + ' 条';
      return s;
    }
    var parts = ['上次 ' + when(st.at)];
    if (st.pushed) parts.push('上传 ' + st.pushed);
    if (st.pulled) parts.push('接收 ' + st.pulled);
    return parts.join(' · ');
  }

  function syncTag(st) {

  function syncField(label, id, val, type, ph) {
    /* 密码框一律用 new-password：浏览器会把挨着的两个密码输入框当成一个「登录表单」，
       拿已保存的登录密码把两个都填上 —— 而「同步口令」正好挨着「登录密码」。
       这正是「两台设备口令不一致」的头号成因，得从根上堵。
       （纯 autocomplete="off" 对密码框经常无效，Chrome 会直接忽略。） */
    var ac = type === 'password' ? 'new-password' : 'off';
    return '<div class="sync-field"><label for="' + id + '">' + esc(label) + '</label>' +
      '<input id="' + id + '" type="' + type + '" value="' + esc(val || '') + '"' +
      ' placeholder="' + esc(ph || '') + '" autocomplete="' + ac + '" spellcheck="false"></div>';
  }

  /* ---------- 配置链接 ----------
     第二台设备要手打「地址 + 密钥 + 口令 + 邮箱」四项，手机上尤其难。
     把这几项编进链接的 # 后面，发过去打开就自动填好。

     放在 # 里是有意的：hash 不会随请求发到服务器，口令只在这台设备的
     地址栏里停留一下，导入后立刻被抹掉。登录密码刻意不放进链接 ——
     那样链接本身就成了钥匙，转发出去就等于把库交出去。 */
  function b64enc(str) {
    var bytes = new TextEncoder().encode(str);
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function b64dec(s) {
    s = String(s).replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  function syncLink() {
    var c = Sync.config();
    if (!c.url || !c.anon || !c.pass) return '';
    var a = Sync.auth() || {};
    var body = JSON.stringify({
      v: 1, url: c.url, anon: c.anon, pass: c.pass, email: a.email || c.email || ''
    });
    var base = String((global.location && location.href) || '').split('#')[0];
    return base + '#sync=' + b64enc(body);
  }

  function importFromHash() {
    var h = String((global.location && location.hash) || '');
    var m = /[#&]sync=([^&]+)/.exec(h);
    if (!m) return false;
    var d = null;
    try { d = JSON.parse(b64dec(m[1])); } catch (e) { return false; }
    if (!d || !d.url || !d.anon || !d.pass) return false;

    Sync.saveConfig({ url: d.url, anon: d.anon, pass: d.pass, email: d.email || '' });
    /* 值已经进本地存储了，地址里那份赶紧抹掉，免得留在历史记录里 */
    try {
      global.history.replaceState(null, '', String(location.href).split('#')[0]);
    } catch (e) { /* 某些环境不让改，不影响功能 */ }
    return true;
  }

  function copyText(t) {
    if (global.navigator && navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(t);
    }
    return Promise.reject(new Error('没有剪贴板权限'));
  }

      '<div class="sync-field"><label for="syncLinkVal">手机配置链接</label>' +
      '<input id="syncLinkVal" type="text" readonly spellcheck="false"></div>' +
      '<p class="sync-tip">发到手机上打开，上面几项会自动填好，手机上只剩输入一次登录密码。' +
      '链接里<b>不含登录密码</b>，口令写在 # 后面、不会发到服务器。</p></div>';

    html += '<div class="sync-line">' + syncTag(st) +
      '<span id="syncDetail">' + esc(syncDetailText(st)) + '</span>' +
      (Sync.configured() ? '<span>· key <span class="sync-fp" id="syncFpVal">…</span></span>' : '') +
      '</div>';

    /* 口令不一致的告警挂在这里，内容由 updateSyncUI 填 */
    html += '<div class="sync-warn" id="syncWarn" hidden></div>';

    html += '<details class="sync-more"><summary>还没建过表？展开看建表语句</summary>' +
      '<pre class="sync-sql">' + esc(SYNC_SQL) + '</pre></details>';

    $('#syncBody').innerHTML = html;

    var btnLogin = $('#syncLogin');
    if (btnLogin) btnLogin.addEventListener('click', doSyncLogin);
    var btnOut = $('#syncOut');
    if (btnOut) btnOut.addEventListener('click', function () {
      Sync.disconnect(); renderSync(); updateSyncUI();
      toast('已断开，本地数据不受影响');
    });
    var btnFp = $('#syncFp');
    if (btnFp) btnFp.addEventListener('click', function () {
      showFingerprint(true);
    });
    var btnLink = $('#syncLink');
    if (btnLink) btnLink.addEventListener('click', function () {
      var link = syncLink();
      if (!link) { toast('先填好上面的地址、密钥和口令', 'warn'); return; }
      copyText(link).then(function () {
        toast('已复制。发到手机上打开，配置自动填好，只剩输一次登录密码', 'good');
      }).catch(function () {
        var box = $('#syncLinkBox'), input = $('#syncLinkVal');
        if (!box || !input) return;
        input.value = link;
        box.hidden = false;
        input.focus();
        input.select();
        toast('剪贴板不可用，链接已显示在下方，手动复制即可', 'warn');
      });
    });
    var cbAuto = $('#syncAuto');
    if (cbAuto) cbAuto.addEventListener('change', function () {
      Sync.setAuto(!!this.checked);
      updateSyncUI();
    });
    [['syncUrl', 'url'], ['syncAnon', 'anon'], ['syncSecret', 'pass'], ['syncEmail', 'email']].forEach(function (pair) {
      var el = $('#' + pair[0]);
      if (!el) return;
      el.addEventListener('input', function () {
        var patch = {}; patch[pair[1]] = el.value;
        Sync.saveConfig(patch);
        updateSyncUI();
      });
      /* 失焦时把粘贴带进来的换行/空格当面清掉 —— 让人看得见发生了什么，
         否则他会一直纳闷「我明明填对了」。口令只削首尾，中间的空格或许是本意。 */
      el.addEventListener('blur', function () {
        var before = String(el.value);
        var next = pair[1] === 'pass' ? before.replace(/^\s+|\s+$/g, '') : squeeze(before);
        if (next === before) return;
        el.value = next;
        var patch = {}; patch[pair[1]] = next;
        Sync.saveConfig(patch);
        updateSyncUI();
        if (pair[1] !== 'pass' && /\s/.test(before)) {
          var note = $('#syncCleanNote');
          if (note) {
            note.textContent = '已去掉粘贴时带进来的空格和换行（密钥本身没问题）';
            note.hidden = false;
          } else {
            toast('密钥里混进了空格或换行，已清掉', 'good');
          }
        }
      });
    });

    /* 指纹要跑一次 PBKDF2，有点慢，放到渲染之后异步补上，
       不阻塞面板打开。 */
    showFingerprint(false);
  }

  function showFingerprint(verbose) {
    var slot = $('#syncFpVal');
    if (!slot) return;
    if (!Sync.configured()) { slot.textContent = '—'; return; }
    slot.textContent = '计算中…';
    Sync.keyFingerprint().then(function (fp) {
      if ($('#syncFpVal')) $('#syncFpVal').textContent = fp;
      if (verbose) toast('密钥指纹 ' + fp + '：两台设备一致才说明口令没打错');
    }).catch(function () {
      if ($('#syncFpVal')) $('#syncFpVal').textContent = '不可用';
    });
  }

  /* 从聊天窗口复制密钥时，折行和缩进会跟着进来。只 trim 首尾是没用的 ——
     夹在中间的那些才是致命的：浏览器照样发请求，服务器只回一句
     「无效的 API 密钥」。所以密钥类字段一律去掉全部空白。 */
  function squeeze(s) { return String(s == null ? '' : s).replace(/\s+/g, ''); }

  function readSyncForm() {
    var get = function (id) { var el = $('#' + id); return el && el.value != null ? el.value : ''; };
    return {
      url: squeeze(get('syncUrl')).replace(/\/+$/, ''),
      anon: squeeze(get('syncAnon')),
      pass: String(get('syncSecret')).replace(/^\s+|\s+$/g, ''),
      email: squeeze(get('syncEmail')),
      loginPass: get('syncPass')
    };
  }

  function doSyncLogin() {
    var f = readSyncForm();
    Sync.saveConfig({ url: f.url, anon: f.anon, pass: f.pass });

    if (!f.url || !f.anon) { toast('先填后端地址和匿名密钥', 'warn'); return; }
    if (!f.pass) { toast('同步口令不能为空', 'warn'); return; }
    if (!f.email || !f.loginPass) { toast('填上邮箱和登录密码', 'warn'); return; }
    if (!Vault.available()) { toast('当前环境不支持加密，需要用 https 打开', 'warn'); return; }

    /* 「同步口令」和「登录密码」填成同一个，是「这台设备写的内容另一台永远读不了」
       的头号成因 —— 两者都是差不多的随机串，两个密码框还挨着。先拦一下。 */
    if (f.pass === f.loginPass) {
      if (!confirm('注意：「同步口令」和「登录密码」填成了同一个。\n\n' +
        '· 同步口令用来加密内容，两台设备必须完全一致\n' +
        '· 登录密码只用于登录后端，跟加密无关\n\n' +
        '如果另一台设备填的不是这个口令，你在这台设备上写的内容，另一台永远读不出来。\n\n' +
        '确定就这样继续吗？')) return;
    }

    toast('正在登录…');
    Sync.signIn(f.email, f.loginPass)
      .catch(function (err) {
        var msg = String(err && err.message || err);
        if (/invalid login|invalid_grant/i.test(msg)) {
          if (!confirm('这个邮箱还没有账号，现在注册一个？')) throw err;
          return Sync.signUp(f.email, f.loginPass).then(function (r) {
            if (r.needConfirm) {
              throw new Error('注册成功，请先去邮箱点确认链接，再回来登录');
            }
          });
        }
        if (/confirm/i.test(msg)) {
          throw new Error('邮箱还没确认：去邮箱点链接，或在 Supabase 后台关掉邮箱确认');
        }
        throw err;
      })
      .then(function () { return Sync.syncNow({}); })
      .then(function (res) {
        renderSync(); updateSyncUI();
        toast('已接通 · 上传 ' + (res.pushed || 0) + ' 条、接收 ' + (res.applied || 0) + ' 条', 'good');
        if (res.applied) render();
        if (Sync.config().auto) Sync.startAuto();
      })
      .catch(function (err) {
        renderSync(); updateSyncUI();
        toast('失败：' + (err && err.message || err), 'warn');
      });
  }

  function manualSync() {
    if (!Sync.connected()) { toast('先登录再同步', 'warn'); return; }
    Sync.syncNow({}).then(function (res) {
      if (res && res.skipped) return;
      updateSyncUI(); renderSync();
      toast('同步完成 · 上传 ' + (res.pushed || 0) + ' 条、接收 ' + (res.applied || 0) + ' 条', 'good');
      if (res.applied) render();
    }).catch(function (err) {
      updateSyncUI(); renderSync();
      toast('同步失败：' + (err && err.message || err), 'warn');
    });
  }

  function updateSyncUI() {
    var st = Sync.getState();
    var right = $('#statusRight');
    if (right) right.textContent = syncLine();

    var btn = $('#btnSync');
    if (btn) {
      if (st.phase === 'ok' && Sync.connected()) btn.classList.add('is-on');
      else btn.classList.remove('is-on');
      if (st.phase === 'error') btn.classList.add('is-err');
      else btn.classList.remove('is-err');
    }

    var nb = $('#syncNowBtn');
    if (nb) {
      nb.disabled = st.phase === 'busy' || !Sync.connected();
      nb.textContent = st.phase === 'busy' ? '同步中…' : '立即同步';
    }

    var hint = $('#syncHint');
    if (hint) {
      hint.textContent = st.error ? st.error : (st.at ? '上次同步 ' + when(st.at) : '');
    }

    var detail = $('#syncDetail');
    if (detail) detail.textContent = syncDetailText(st);

    /* 告警块：内容没变就不重绘，不然每 30 秒一轮自动同步都会把
       已经展开的面板搅一遍、还会丢掉按钮上的监听。 */
    var warn = $('#syncWarn');
    if (warn) {
      var html = syncWarnHTML(st);
      if (warn.getAttribute('data-sig') !== html) {
        warn.setAttribute('data-sig', html);
        warn.innerHTML = html;
        warn.hidden = !html;
        var fb = $('#syncForget');
        if (fb) fb.addEventListener('click', function () {
          var n = (Sync.getState().brokenList || []).length;
          if (!confirm('清掉这 ' + n + ' 条读不了的云端内容？\n\n' +
            '它们在本机没有副本，任何设备都解不开，所以删掉不影响你现有的笔记。\n' +
            '手里有这条内容的那台设备，下次用正确口令同步时会自动补回来。')) return;
          Sync.forgetBroken().then(function (k) {
            toast('已清掉 ' + k + ' 条', 'good');
            updateSyncUI();
          }).catch(function (e) {
            toast('清理失败：' + (e && e.message || e), 'warn');
          });
        });
      } else {
        warn.hidden = !html;
      }
    }
  }

  /* ===========================================================
     启动
     =========================================================== */
  function boot() {
    DB.purgeTrash(30);   // 清掉过期的墓碑，同时顺带把数据层预热起来
    /* 从配置链接进来时，先把同步配置装好，再往下渲染 ——
       这样面板一打开就是填好的状态，不用先看到空表单再跳变。 */
    var imported = importFromHash();
    bind();
    syncTabs();
    $('#toggleRel').style.background = 'var(--accent-soft)';
    $('#toggleRel').style.color = 'var(--accent-deep)';
    render();
    status(summaryLine(), null);
    if (imported) {
      Sync.refreshIdleState();
      updateSyncUI();
      setTimeout(function () {
        toast('同步配置已从链接导入，填一次登录密码再点「登录并启用」', 'good');
      }, 500);
      return;
    }
    if (!localStorage.getItem('spark-notes/seen')) {
      localStorage.setItem('spark-notes/seen', '1');
      setTimeout(function () { toast('已放入示例数据，可直接编辑或清空', 'good'); }, 700);
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  global.Spark = { toast: toast, render: render, batchAcceptAll: batchAcceptAll };
})(window);


</script>
</body>
</html>
